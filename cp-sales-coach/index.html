<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"/>
<title>CP Sales Coach — Assistant d'appel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Cormorant+Garamond:ital@1&display=swap" rel="stylesheet"/>
<style>
:root{
  --cp-blue:#6F8CB8; --cp-deep:#4F6FA0; --cp-dark:#2A3E5F; --cp-soft:#B8C8DD;
  --cp-pale:#E8EEF5; --cp-veil:#F4F7FB; --ink:#2A3142; --ink-soft:#525B70;
  --ink-mid:#8C95A8; --line:rgba(111,140,184,.18);
  --ok:#1F9E75; --warn:#C9871F; --danger:#C0492F;
  --sans:'Montserrat',system-ui,-apple-system,sans-serif;
  --serif:'Cormorant Garamond',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--cp-veil);color:var(--ink);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;cursor:pointer;border:0;background:0;color:inherit}

/* ── App shell : 3 zones (topbar / écran / nav) ── */
#app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto;position:relative}

/* topbar */
.top{flex:0 0 auto;background:var(--cp-dark);color:#fff;padding:env(safe-area-inset-top) 0 0}
.top-in{display:flex;align-items:center;gap:12px;padding:11px 16px}
.top-logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--cp-blue),var(--cp-deep));display:grid;place-items:center;font-weight:900;font-size:13px;flex:0 0 auto}
.top-mid{flex:1;min-width:0}
.top-phase{font-size:12.5px;font-weight:800;letter-spacing:.02em;line-height:1.1}
.top-sub{font-size:10px;color:var(--cp-soft);font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-top:1px}
.top-btn{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:0 0 auto;transition:.15s}
.top-btn:active{background:rgba(255,255,255,.24)}
.bar{height:4px;background:rgba(255,255,255,.14)}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--cp-soft),#fff);border-radius:0 3px 3px 0;transition:width .35s cubic-bezier(.3,.8,.3,1)}

/* écran central */
.screen{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px 18px 24px;display:flex;flex-direction:column;animation:slidein .28s cubic-bezier(.25,.8,.3,1)}
@keyframes slidein{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.scr-tag{display:inline-flex;align-self:flex-start;align-items:center;gap:7px;padding:6px 13px;border-radius:9px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;margin-bottom:16px}
.scr-tag.ask{background:var(--cp-pale);color:var(--cp-deep)}
.scr-tag.say{background:#dff2ea;color:var(--ok)}
.scr-tag.warn{background:#FBEFD8;color:var(--warn)}
.scr-tag.reco{background:#e7e0f5;color:#6b40b8}
.scr-q{font-size:23px;font-weight:800;color:var(--cp-dark);line-height:1.22;letter-spacing:-.01em;margin-bottom:6px}
.scr-sub{font-size:13.5px;color:var(--ink-mid);line-height:1.5;margin-bottom:18px}

/* options (gros boutons tap) */
.opts{display:flex;flex-direction:column;gap:9px}
.opts.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 16px;border:2px solid var(--line);border-radius:15px;background:#fff;font-size:15.5px;font-weight:600;color:var(--ink);text-align:left;transition:.14s;line-height:1.25}
.opt:active{transform:scale(.985)}
.opt.sel{border-color:var(--cp-deep);background:var(--cp-deep);color:#fff;box-shadow:0 8px 20px -8px rgba(79,111,160,.55)}
.opt .oic{font-size:21px;flex:0 0 auto;width:26px;text-align:center}
.opt .ock{margin-left:auto;font-size:18px;opacity:0;transition:.15s}
.opt.sel .ock{opacity:1}
.opt small{display:block;font-weight:600;font-size:11.5px;color:var(--ink-mid);margin-top:1px}
.opt.sel small{color:rgba(255,255,255,.8)}

/* bloc à demander (dig) */
.ask-box{margin-top:16px;background:linear-gradient(180deg,#fff8ec,#fdeed3);border:1.5px solid #f0cd8a;border-radius:14px;padding:14px 16px;animation:pop .3s}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ask-box .h{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#9a6608;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.ask-box .q{font-size:15px;color:#5a4216;line-height:1.5;font-weight:500}

/* phrase clé levier (âge) */
.lever{margin-top:14px;background:#fff;border-left:4px solid var(--cp-blue);border-radius:0 12px 12px 0;padding:12px 15px;font-family:var(--serif);font-style:italic;font-size:16px;color:var(--cp-dark);line-height:1.4}

/* écran SCRIPT (à dire) */
.say-card{flex:1;display:flex;flex-direction:column;justify-content:center}
.say-big{font-size:clamp(22px,5.4vw,30px);font-weight:700;line-height:1.32;color:var(--cp-dark);letter-spacing:-.01em}
.say-big.quote{position:relative;padding-left:6px}
.say-big b{color:var(--cp-deep);font-weight:800}
.say-big em{font-family:var(--serif);font-style:italic;font-weight:500}
.say-hint{margin-top:20px;font-size:13.5px;color:var(--ink-mid);font-style:italic;line-height:1.5;display:flex;gap:8px;align-items:flex-start}
.say-hint .b{flex:0 0 auto}

/* reco card */
.reco-card{border-radius:20px;padding:24px 22px;color:#fff;position:relative;overflow:hidden;margin-bottom:14px}
.reco-card.p2{background:linear-gradient(135deg,var(--cp-deep),var(--cp-dark))}
.reco-card.p3{background:linear-gradient(135deg,#3a2f6b,#2A3E5F)}
.reco-card.p1{background:linear-gradient(135deg,#5a6b82,#3f4a5f)}
.reco-badge{display:inline-block;background:rgba(255,255,255,.22);border-radius:8px;padding:5px 11px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
.reco-name{font-size:27px;font-weight:900;letter-spacing:-.02em;line-height:1.05}
.reco-freq{font-size:13px;color:rgba(255,255,255,.8);margin-top:3px;font-weight:600}
.reco-price{display:flex;align-items:baseline;gap:9px;margin-top:16px;flex-wrap:wrap}
.reco-price .now{font-size:34px;font-weight:900;letter-spacing:-.02em}
.reco-price .un{font-size:13px;color:rgba(255,255,255,.75);font-weight:600}
.reco-price .old{font-size:15px;text-decoration:line-through;color:rgba(255,255,255,.5)}
.reco-foot{font-size:11.5px;color:var(--cp-soft);margin-top:6px;font-weight:600}
.cls{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-top:1px solid var(--line)}
.cls:first-child{border-top:0}
.cls .n{width:26px;height:26px;border-radius:8px;background:var(--cp-pale);color:var(--cp-deep);font-weight:800;font-size:12px;display:grid;place-items:center;flex:0 0 auto}
.cls .nm{font-weight:800;color:var(--cp-dark);font-size:14.5px}
.cls .ds{font-size:12px;color:var(--ink-soft);margin-top:1px;line-height:1.4}
.cls-warn{background:#FBEFD8;border-radius:10px;padding:9px 12px;font-size:12px;color:var(--warn);font-weight:600;margin-top:8px;line-height:1.4}
.lvl-tag{display:inline-block;font-size:9.5px;font-weight:800;color:#fff;padding:2px 7px;border-radius:6px;letter-spacing:.02em;vertical-align:middle}
.biens{list-style:none;margin:7px 0 0;padding:0}
.biens li{position:relative;padding:3px 0 3px 18px;font-size:12.5px;line-height:1.4;color:var(--ink)}
.biens li::before{content:'✓';position:absolute;left:0;color:var(--ok);font-weight:800;font-size:12px}
.pourqui{margin-top:8px;background:var(--cp-pale);border-radius:9px;padding:7px 10px;font-size:11.5px;line-height:1.4;color:var(--cp-deep);font-weight:600}
/* Guide des cours */
.cg{padding-bottom:10px}
.cg-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(20,40,80,.04)}
.cg-head{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.cg-nm{font-size:17px;font-weight:800;color:var(--cp-dark)}
.cg-fam{font-size:11px;font-weight:600;color:var(--ink-mid)}
.cg-quoi{font-size:13.5px;line-height:1.55;color:var(--ink-soft);margin-bottom:12px}
.cg-sec{margin-bottom:11px}
.cg-lab{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--cp-deep);margin-bottom:3px}
.cg-txt{font-size:12.5px;line-height:1.45;color:var(--ink)}
.cg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:11px}
@media(max-width:430px){.cg-grid{grid-template-columns:1fr}}
.cg-box{border-radius:12px;padding:10px 12px}
.cg-box.body{background:#EAF4EF}
.cg-box.mind{background:#EDF0FA}
.cg-bh{font-size:11.5px;font-weight:800;margin-bottom:6px;color:var(--cp-dark)}
.cg-box ul{list-style:none;margin:0;padding:0}
.cg-box li{position:relative;padding:2px 0 2px 15px;font-size:12px;line-height:1.4;color:var(--ink)}
.cg-box li::before{content:'•';position:absolute;left:2px;font-weight:800}
.cg-box.body li::before{color:var(--ok)}
.cg-box.mind li::before{color:var(--cp-deep)}
.cg-foot{border-top:1px dashed var(--line);padding-top:9px;display:flex;flex-direction:column;gap:5px}
.cg-pre,.cg-restr{font-size:11.5px;line-height:1.45;color:var(--ink-soft)}
.cg-pre b,.cg-restr b{color:var(--cp-dark);font-weight:700}
.cg-note{background:#FBEFD8;border-radius:12px;padding:11px 13px;font-size:12px;line-height:1.5;color:var(--warn);font-weight:600;margin-top:4px}
.pack-switch{display:flex;gap:7px;margin-top:6px}
.pack-switch button{flex:1;padding:9px 6px;border:1.5px solid var(--line);border-radius:11px;font-size:11.5px;font-weight:700;color:var(--ink-soft);background:#fff;line-height:1.2}
.pack-switch button.cur{background:var(--cp-pale);border-color:var(--cp-blue);color:var(--cp-deep)}
.pack-switch small{display:block;font-size:9.5px;color:var(--ink-mid);font-weight:600;margin-top:1px}

/* reframe value cards */
.rf{display:flex;align-items:flex-start;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:9px}
.rf .ic{width:40px;height:40px;border-radius:11px;background:var(--cp-pale);display:grid;place-items:center;font-size:19px;flex:0 0 auto}
.rf .big{font-weight:900;color:var(--cp-deep);font-size:18px;letter-spacing:-.01em;line-height:1.1}
.rf .lab{font-size:12.5px;color:var(--ink-soft);line-height:1.4;margin-top:2px}
.rf .lab b{color:var(--cp-deep)}
.rf-say{margin-top:8px;background:var(--cp-veil);border-left:3px solid var(--cp-blue);border-radius:8px;padding:8px 11px;font-size:13px;line-height:1.5;color:var(--cp-dark);font-weight:600}
.rf-anchor{background:#FBEFD8;border-radius:11px;padding:10px 13px;font-size:12px;line-height:1.45;color:var(--warn);font-weight:600;margin-bottom:12px}
.rf-anchor b{color:#7a4400}
.rf-proof{margin-top:14px;background:var(--cp-veil);border-radius:14px;padding:13px 14px}
.rf-proof-h{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--cp-deep);margin-bottom:9px}
.rf-chip{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:11.5px;font-weight:600;color:var(--cp-dark);margin:0 6px 6px 0;line-height:1.3}

.flex-note{display:flex;align-items:flex-start;gap:10px;background:var(--cp-pale);border-radius:13px;padding:12px 14px;margin-top:10px;font-size:12.5px;line-height:1.45;color:var(--cp-deep)}
.flex-note .fic{font-size:17px;flex:0 0 auto}
.flex-note b{font-weight:800}
/* Comparatif rythme 1x / 2x / illimité */
.rythme{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.rythme-h{font-size:12.5px;font-weight:800;color:var(--cp-deep);margin-bottom:10px;line-height:1.3}
.rythme-row{border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px;transition:all .15s}
.rythme-row.cur{border-color:var(--cp-blue);background:var(--cp-veil);box-shadow:0 2px 10px rgba(111,140,184,.18)}
.rr-freq{font-size:14px;font-weight:800;color:var(--cp-dark)}
.rythme-row.cur .rr-freq{color:var(--cp-deep)}
.rr-time{font-size:13px;font-weight:700;color:var(--cp-blue);margin:2px 0 4px}
.rr-time small{font-weight:600;color:var(--ink-mid);font-size:10.5px;margin-left:5px}
.rr-lab{font-size:12px;line-height:1.4;color:var(--ink-soft)}
.rythme-foot{font-size:10.5px;color:var(--ink-mid);text-align:center;margin-top:4px;font-style:italic}
.pres-h{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--cp-deep);margin:18px 0 10px}
.pres-line{font-size:13.5px;line-height:1.55;color:var(--ink-soft);padding:7px 0;border-top:1px dashed var(--line)}
.pres-line:first-child{border-top:0;padding-top:0}
.pres-line b{color:var(--cp-dark);font-weight:700}
.testi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:9px;border-left:3px solid var(--cp-blue)}
.testi-q{font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.45;color:var(--cp-dark)}
.testi-a{font-size:11px;color:var(--ink-mid);margin-top:6px;font-weight:600}
.testi-note{background:var(--cp-pale);border-radius:10px;padding:9px 12px;font-size:11px;line-height:1.45;color:var(--cp-deep);margin-top:4px}
.press{background:var(--cp-dark);color:#fff;border-radius:14px;padding:14px 16px;margin-bottom:9px;text-align:center}
.press-src{font-size:13px;font-weight:900;letter-spacing:.22em;text-transform:uppercase;opacity:.85}
.press-q{font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.35;margin:7px 0 6px}
.press-note{font-size:11px;color:rgba(255,255,255,.65);line-height:1.4}
/* La science */
.sci-tl{padding:9px 0;border-top:1px dashed var(--line)}
.sci-tl:first-child{border-top:0;padding-top:0}
.sci-tl-t{font-size:12.5px;font-weight:800;color:var(--cp-deep)}
.sci-tl-f{font-size:12.5px;line-height:1.45;color:var(--ink-soft);margin-top:2px}
.sci-src{font-size:11.5px;line-height:1.6;color:var(--ink-soft)}
.sci-diff{background:var(--cp-dark);color:#fff;border-radius:16px;padding:16px;margin-bottom:14px}
.sci-diff-h{font-size:15px;font-weight:800;margin-bottom:7px;line-height:1.3}
.sci-diff-d{font-size:13px;line-height:1.55;color:rgba(255,255,255,.82)}
.sci-diff .biens{margin-top:9px}
.sci-diff .biens li{color:#fff;font-weight:600}
.sci-diff .biens li::before{color:#9ec5a8}
/* card générique */
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px}

/* recap final */
.recap{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;color:var(--ink);max-height:38vh;overflow-y:auto}

/* nav bas */
.nav{flex:0 0 auto;display:flex;gap:10px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.nav .back{flex:0 0 auto;width:58px;border-radius:14px;background:var(--cp-veil);color:var(--ink-soft);font-size:22px;font-weight:700;display:grid;place-items:center}
.nav .back:active{background:var(--cp-pale)}
.nav .go{flex:1;border-radius:14px;background:var(--cp-deep);color:#fff;font-weight:800;font-size:16px;letter-spacing:.01em;display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px}
.nav .go:active{background:var(--cp-dark)}
.nav .go.ok{background:var(--ok)}

/* bouton objections flottant */
.fab{position:absolute;right:14px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:30;background:var(--cp-dark);color:#fff;border-radius:50%;width:56px;height:56px;display:grid;place-items:center;box-shadow:0 10px 26px -8px rgba(42,62,95,.6)}
.fab:active{transform:scale(.94)}
.fab .lbl{position:absolute;right:64px;background:var(--cp-dark);color:#fff;font-size:12px;font-weight:700;padding:6px 11px;border-radius:9px;white-space:nowrap;opacity:0;pointer-events:none}

/* sheets (objections / menu) */
.sheet-bg{position:fixed;inset:0;background:rgba(42,49,66,.5);z-index:50;opacity:0;pointer-events:none;transition:.22s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--cp-veil);border-radius:22px 22px 0 0;max-height:90vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(.3,.85,.3,1);max-width:560px;margin:0 auto}
.sheet.on{transform:translateY(0)}
.sheet-h{flex:0 0 auto;padding:16px 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-h .t{font-size:17px;font-weight:900;color:var(--cp-dark)}
.sheet-x{width:36px;height:36px;border-radius:11px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:19px;color:var(--ink-soft);flex:0 0 auto}
.sheet-body{flex:1 1 auto;overflow-y:auto;padding:0 18px calc(18px + env(safe-area-inset-bottom))}
.search{width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:13px;font:inherit;font-size:15px;margin-bottom:12px;background:#fff}
.search:focus{outline:0;border-color:var(--cp-blue)}
.obj{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.obj-h{display:flex;align-items:center;gap:10px;padding:13px 15px;font-weight:800;color:var(--cp-dark);font-size:14.5px;cursor:pointer}
.obj-h .ic{width:30px;height:30px;border-radius:9px;background:var(--cp-pale);display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.obj-h .ch{margin-left:auto;color:var(--ink-mid);transition:.2s}
.obj.open .obj-h .ch{transform:rotate(180deg)}
.obj-b{display:none;padding:0 15px 14px}
.obj.open .obj-b{display:block}
.obj-b .ln{padding:9px 0;border-top:1px dashed var(--line);font-size:13.5px;line-height:1.55;color:var(--ink-soft)}
.obj-b .ln:first-child{border-top:0}
.obj-b b{color:var(--cp-deep);font-weight:700}
.menu-item{display:flex;align-items:center;gap:13px;width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:9px;font-size:15.5px;font-weight:700;color:var(--ink);text-align:left}
.menu-item:active{background:var(--cp-pale)}
.menu-item .mic{width:34px;height:34px;border-radius:10px;background:var(--cp-pale);display:grid;place-items:center;font-size:17px;flex:0 0 auto}
.menu-item small{display:block;font-size:11.5px;font-weight:600;color:var(--ink-mid);margin-top:1px}

/* académie */
.aca{padding:4px 0}
.aca-h{background:linear-gradient(135deg,var(--cp-dark),#1c2c47);color:#fff;border-radius:16px;padding:20px;margin-bottom:12px}
.aca-h h2{font-size:20px;font-weight:900;margin-bottom:6px}
.aca-h p{font-size:13px;color:rgba(255,255,255,.85);line-height:1.5}
.aca-l{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:10px}
.aca-l .nb{display:inline-block;background:var(--cp-pale);color:var(--cp-deep);font-size:10px;font-weight:800;letter-spacing:.05em;padding:3px 9px;border-radius:6px;margin-bottom:7px}
.aca-l h3{font-size:15.5px;font-weight:900;color:var(--cp-dark);margin-bottom:5px}
.aca-l .ld{font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin-bottom:8px}
.aca-row{display:flex;gap:8px;font-size:13px;color:var(--ink-soft);line-height:1.45;padding:6px 0}
.aca-row .ck{color:var(--ok);font-weight:900;flex:0 0 auto}
.lvls{display:grid;gap:8px}
.lvl{border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.lvl .bg{display:inline-block;font-size:10.5px;font-weight:800;color:#fff;padding:3px 9px;border-radius:7px;letter-spacing:.03em}
.lvl .lt{font-size:14.5px;font-weight:900;color:var(--cp-dark);margin:5px 0 3px}
.lvl .ld{font-size:12px;color:var(--ink-soft);line-height:1.45}
.strat{background:linear-gradient(135deg,#fef3c7,#fdebcd);border:1px solid #f0d090;border-radius:13px;padding:14px}
.strat .pq{font-family:var(--serif);font-style:italic;font-size:14px;color:#5a4419;line-height:1.5;margin:6px 0 8px}
.strat ul{list-style:none}
.strat li{font-size:12px;color:#7a4400;padding:2px 0 2px 16px;position:relative}
.strat li::before{content:'⚡';position:absolute;left:-2px;font-size:11px}

/* settings modal */
.modal-bg{position:fixed;inset:0;background:rgba(42,49,66,.55);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:20px 14px;overflow-y:auto}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:18px;max-width:480px;width:100%;padding:20px;margin:auto}
.modal h3{font-size:18px;font-weight:900;color:var(--cp-dark);margin-bottom:14px}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px}
.fld input{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;font:inherit;font-size:15px}
.fld input:focus{outline:0;border-color:var(--cp-blue)}
.fld .hint{font-size:11px;color:var(--ink-mid);margin-top:4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal .nav2{display:flex;gap:10px;margin-top:8px}
.modal .nav2 button{flex:1;padding:13px;border-radius:12px;font-weight:800}
.modal .nav2 .cx{background:var(--cp-veil);color:var(--ink-soft)}
.modal .nav2 .sv{background:var(--cp-deep);color:#fff}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--cp-dark);color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:700;z-index:80;opacity:0;pointer-events:none;transition:.3s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.divider{height:1px;background:var(--line);margin:14px 0}
</style>

const $=s=>document.querySelector(s);
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function lbl(list,id){const o=list.find(x=>x.id===id);return o?o.label:id}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1700)}
function ageBand(){return AGE_BANDS.find(b=>b.id===st.ageBand)||null}
function trig(){return TRIGGERS.find(t=>t.id===st.trigger)||null}
function emo(){return EMOTIONS.find(e=>e.id===st.emotion)||null}
function activeHealth(){return st.health.filter(h=>h!=='aucun')}
function frList(arr){if(!arr.length)return '';if(arr.length===1)return arr[0];return arr.slice(0,-1).join(', ')+' et '+arr[arr.length-1];}

// Pack idéal selon le profil (indépendant du choix manuel du commercial)
function idealPack(){
  const g=st.goals,pain=st.pain;let score=2;
  if(st.dispo==='high')score=3;
  if(g.includes('perf')&&st.dispo!=='low')score=3;
  if(st.dispo==='low'){score=(pain.includes('temps')&&st.reason.includes('reprise'))?1:2;if(pain.includes('resultats'))score=2;}
  return score;
}
function recommendPack(){return st.packChoice||idealPack();}
function recommendClasses(pack){
  const g=st.goals,health=activeHealth(),pain=st.pain;
  const blocked=id=>CLASSES[id].restr.some(r=>r==='blessure_prolongee'?(health.includes('genou')||health.includes('chirurgie')):health.includes(r));
  const out=[];
  const veryBeginner=pain.includes('jamais')||st.ageBand==='55-70'||health.includes('senior');
  if(veryBeginner)out.push({id:'foundation05'});
  out.push({id:'flow1'});
  let second=null;
  if(g.includes('poids')){if(!blocked('cs1'))second='cs1';else if(!blocked('cb'))second='cb';}
  if(!second&&(g.includes('mobilite')||g.includes('posture')))second='cb';
  if(!second&&(g.includes('douleur')||g.includes('stress')))second=!blocked('restore')?'restore':'cb';
  if(!second&&g.includes('tonus'))second=!blocked('cs1')?'cs1':'cb';
  if(!second)second=!blocked('cs1')?'cs1':'cb';
  out.push({id:second});
  if(pack===3){const used=out.map(o=>o.id);const c=['cb','restore','cs1'].filter(x=>!used.includes(x)&&!blocked(x));if(c.length)out.push({id:c[0]});}
  return out;
}
function classWarnings(recos){
  const health=activeHealth(),w=[];
  recos.forEach(r=>{const hit=CLASSES[r.id].restr.filter(x=>x==='blessure_prolongee'?(health.includes('genou')||health.includes('chirurgie')):health.includes(x));if(hit.length)w.push(`${CLASSES[r.id].nm} : prudence — ${hit.map(h=>lbl(HEALTH,h)||h).join(', ')}. Valider avec le coach.`);});
  return w;
}
function matchScore(pack){
  pack=pack||recommendPack();
  // 1) Confiance : plus la découverte est riche, plus on est sûr.
  let s=46;
  s+=Math.min(st.goals.length,3)*4;
  if(st.pain.length)s+=5;if(st.trigger)s+=5;if(st.emotion)s+=4;if(st.dispo)s+=5;if(st.tried.length)s+=3;if(st.reason.length)s+=3;
  // 2) Adéquation du pack choisi avec le profil.
  const ideal=idealPack();
  if(pack===ideal)s+=12; else s-=Math.abs(pack-ideal)*7;
  if(pack===3){ if(st.dispo==='high'||st.goals.includes('perf'))s+=6; if(st.dispo==='low')s-=10; }
  if(pack===1){ if(st.dispo==='low')s+=5; else s-=5; }
  if(pack===2&&st.dispo&&st.dispo!=='low')s+=3;
  return Math.max(35,Math.min(99,Math.round(s)));
}

function pick(field,id,single){
  if(single){st[field]=(st[field]===id?null:id);}
  else if(field==='health'){
    if(id==='aucun')st.health=['aucun'];
    else{const i=st.health.indexOf('aucun');if(i>=0)st.health.splice(i,1);const j=st.health.indexOf(id);if(j>=0)st.health.splice(j,1);else st.health.push(id);}
  } else {
    const a=st[field],i=a.indexOf(id);if(i>=0)a.splice(i,1);else a.push(id);
  }
  renderScreen();
}
function pickPack(p){st.packChoice=(st.packChoice===p?null:p);renderScreen();}

function buildRecap(){
  const pack=recommendPack(),recos=recommendClasses(pack),ah=activeHealth(),L=[];
  L.push(`FICHE PROSPECT — ${('Club Pilates '+(CFG.studio||'')).trim()}`);
  if(CFG.rep)L.push(`Commercial : ${CFG.rep}`);L.push('');
  const b=ageBand();if(b)L.push(`Âge : ${b.label}`);
  L.push(`Connaît CP : ${st.connait==='oui'?'Oui':st.connait==='non'?'Non':'—'}`);
  if(st.reason.length)L.push(`Motif : ${st.reason.map(r=>lbl(REASONS,r)).join(', ')}`);
  if(st.trigger)L.push(`Déclencheur : ${lbl(TRIGGERS,st.trigger)}`);
  if(st.tried.length)L.push(`A essayé : ${st.tried.map(t=>lbl(TRIED,t)).join(', ')}`);
  if(st.pain.length)L.push(`Douleur : ${st.pain.map(p=>lbl(PAINS,p)).join(', ')}`);
  if(st.goals.length)L.push(`Objectifs : ${st.goals.map(g=>lbl(GOALS,g)).join(', ')}`);
  if(st.emotion)L.push(`Enjeu profond : ${lbl(EMOTIONS,st.emotion)}`);
  if(ah.length)L.push(`Santé : ${ah.map(h=>lbl(HEALTH,h)).join(', ')}`);
  if(st.dispo)L.push(`Dispo : ${lbl(DISPO,st.dispo)}`);L.push('');
  L.push(`Objectif appel : ${st.callGoal==='trial'?'Essai gratuit':'Abonnement'}`);
  L.push(`RECO : ${PACK_META[pack].name} (${PACK_META[pack].freq})`);
  L.push(`Cours : ${recos.map(r=>CLASSES[r.id].nm).join(' + ')}`);
  const mF=fmtEur(packMonthly(pack)),fmF=fmtEur(foundingMonthly(pack));
  if(mF)L.push(`Tarif : ${mF}/mois${fmF?` → ${fmF}/mois fondateur`:''}`);
  L.push(`Match : ${matchScore(recommendPack())}%`);
  return L.join('\n');
}
function copyRecap(){const t=buildRecap();navigator.clipboard?.writeText(t).then(()=>toast('Fiche copiée ✓')).catch(()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Fiche copiée ✓');});}

    <div class="pres-h">✅ Les conditions pour des résultats</div>
    <div class="card" style="margin-bottom:14px">${SCI_CONDITIONS.map(c=>`<div class="cls"><div class="n" style="font-size:15px">${c.ic}</div><div><div class="nm">${c.t}</div><div class="ds">${c.d}</div></div></div>`).join('')}</div>
    <div class="flex-note"><span class="fic">💡</span><span><b>L'argument qui vend, et qui est vrai :</b> la science dit que le résultat dépend de l'encadrement. C'est exactement notre force — coachs certifiés, 12 max, progression sur-mesure.</span></div>
    <div class="pres-h">🛡️ La nuance qui inspire confiance</div>
    <div class="cg-note">${SCI_NUANCE}</div>
    <div class="pres-h">📚 Sources</div>
    <div class="card">${SCI_SOURCES.map(s=>`<div class="sci-src">• ${s}</div>`).join('')}</div>
  </div>`;
  $('#screen').innerHTML=h;$('#screen').scrollTop=0;
  $('#topPhase').textContent='La science';
  $('#nav').innerHTML=`<button class="go" onclick="renderScreen()">📞 Revenir à l'appel</button>`;
  $('#bar').style.width='100%';
}

/* ── Réglages ── */
function openSet(){['studio','rep','base','p1','p2','p3','founding'].forEach(k=>$('#set-'+k).value=CFG[k]??'');$('#set-priv').value=CFG.privateSession??'';$('#set-spots').value=CFG.spotsLeft??'';$('#setBg').classList.add('on');}
function closeSet(){$('#setBg').classList.remove('on');}
function saveSet(){
  CFG.studio=$('#set-studio').value.trim();CFG.rep=$('#set-rep').value.trim();
  CFG.base=parseFloat($('#set-base').value)||DEFAULT_CFG.base;
  CFG.p1=$('#set-p1').value===''?null:parseFloat($('#set-p1').value);
  CFG.p2=$('#set-p2').value===''?null:parseFloat($('#set-p2').value);
  CFG.p3=$('#set-p3').value===''?null:parseFloat($('#set-p3').value);
  CFG.privateSession=$('#set-priv').value===''?null:parseFloat($('#set-priv').value);
  CFG.spotsLeft=$('#set-spots').value===''?null:parseInt($('#set-spots').value,10);
  CFG.founding=$('#set-founding').value===''?0:parseFloat($('#set-founding').value);
  localStorage.setItem('cpcoach_cfg',JSON.stringify(CFG));closeSet();renderScreen();toast('Réglages enregistrés ✓');
}

renderScreen();
</script>
</body>
</html>
