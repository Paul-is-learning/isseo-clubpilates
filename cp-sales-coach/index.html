<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"/>
<title>CP Sales Coach · Assistant d'appel</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#F4F1EA"/>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Sales Coach"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Cormorant+Garamond:ital@1&display=swap" rel="stylesheet"/>
<style>
:root{
  --cp-blue:#6F8CB8; --cp-deep:#4F6FA0; --cp-dark:#2A3E5F; --cp-soft:#B8C8DD;
  --cp-pale:#E8EEF5; --cp-veil:#F4F7FB; --ink:#2A3142; --ink-soft:#525B70;
  --ink-mid:#8C95A8; --line:rgba(111,140,184,.18);
  --ok:#1F9E75; --warn:#C9871F; --danger:#C0492F;
  --sans:'Montserrat',system-ui,-apple-system,sans-serif;
  --serif:'Cormorant Garamond',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--cp-veil);color:var(--ink);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;cursor:pointer;border:0;background:0;color:inherit}

/* ── App shell : 3 zones (topbar / écran / nav) ── */
#app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto;position:relative}

/* topbar */
.top{flex:0 0 auto;background:var(--cp-dark);color:#fff;padding:env(safe-area-inset-top) 0 0}
.top-in{display:flex;align-items:center;gap:12px;padding:11px 16px}
.top-logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--cp-blue),var(--cp-deep));display:grid;place-items:center;font-weight:900;font-size:13px;flex:0 0 auto}
.top-mid{flex:1;min-width:0}
.top-phase{font-size:12.5px;font-weight:800;letter-spacing:.02em;line-height:1.1}
.top-sub{font-size:10px;color:var(--cp-soft);font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-top:1px}
.top-btn{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:0 0 auto;transition:.15s}
.top-btn:active{background:rgba(255,255,255,.24)}
.bar{height:4px;background:rgba(255,255,255,.14)}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--cp-soft),#fff);border-radius:0 3px 3px 0;transition:width .35s cubic-bezier(.3,.8,.3,1)}

/* écran central */
.screen{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px 18px 24px;display:flex;flex-direction:column;animation:slidein .28s cubic-bezier(.25,.8,.3,1)}
.screen>*{flex-shrink:0}
@keyframes slidein{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.scr-tag{display:inline-flex;align-self:flex-start;align-items:center;gap:7px;padding:6px 13px;border-radius:9px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;margin-bottom:16px}
.scr-tag.ask{background:var(--cp-pale);color:var(--cp-deep)}
.scr-tag.say{background:#dff2ea;color:var(--ok)}
.scr-tag.warn{background:#FBEFD8;color:var(--warn)}
.scr-tag.reco{background:#e7e0f5;color:#6b40b8}
.scr-q{font-size:23px;font-weight:800;color:var(--cp-dark);line-height:1.22;letter-spacing:-.01em;margin-bottom:6px}
.scr-sub{font-size:13.5px;color:var(--ink-mid);line-height:1.5;margin-bottom:18px}

/* options (gros boutons tap) */
.opts{display:flex;flex-direction:column;gap:9px}
.opts.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 16px;border:2px solid var(--line);border-radius:15px;background:#fff;font-size:15.5px;font-weight:600;color:var(--ink);text-align:left;transition:.14s;line-height:1.25}
.opt:active{transform:scale(.985)}
.opt.sel{border-color:var(--cp-deep);background:var(--cp-deep);color:#fff;box-shadow:0 8px 20px -8px rgba(79,111,160,.55)}
.opt .oic{font-size:21px;flex:0 0 auto;width:26px;text-align:center}
.opt .ock{margin-left:auto;font-size:18px;opacity:0;transition:.15s}
.opt.sel .ock{opacity:1}
.opt small{display:block;font-weight:600;font-size:11.5px;color:var(--ink-mid);margin-top:1px}
.opt.sel small{color:rgba(255,255,255,.8)}

/* bloc à demander (dig) */
.ask-box{margin-top:16px;background:linear-gradient(180deg,#fff8ec,#fdeed3);border:1.5px solid #f0cd8a;border-radius:14px;padding:14px 16px;animation:pop .3s}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ask-box .h{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#9a6608;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.ask-box .q{font-size:15px;color:#5a4216;line-height:1.5;font-weight:500}
.catch-box{margin-top:14px;background:linear-gradient(180deg,#effaf4,#e2f5ea);border:1.5px solid #aee0c6;border-radius:14px;padding:14px 16px;animation:pop .3s}
.catch-box .h{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ok);margin-bottom:9px;display:flex;align-items:center;gap:6px}
.catch-box .ln{display:flex;align-items:flex-start;gap:9px;font-size:15px;color:#1d5b41;line-height:1.5;font-weight:600;padding:6px 0;border-top:1px dashed #aee0c6}
.catch-box .ln:first-of-type{border-top:0;padding-top:0}
.catch-box .ci{font-size:17px;flex:0 0 auto;line-height:1.4}

/* phrase clé levier (âge) */
.lever{margin-top:14px;background:#fff;border-left:4px solid var(--cp-blue);border-radius:0 12px 12px 0;padding:12px 15px;font-family:var(--serif);font-style:italic;font-size:16px;color:var(--cp-dark);line-height:1.4}

/* écran SCRIPT (à dire) */
.say-card{flex:1;display:flex;flex-direction:column;justify-content:center}
.say-big{font-size:clamp(22px,5.4vw,30px);font-weight:700;line-height:1.32;color:var(--cp-dark);letter-spacing:-.01em}
.say-big.quote{position:relative;padding-left:6px}
.say-big b{color:var(--cp-deep);font-weight:800}
.say-big em{font-family:var(--serif);font-style:italic;font-weight:500}
.say-hint{margin-top:20px;font-size:13.5px;color:var(--ink-mid);font-style:italic;line-height:1.5;display:flex;gap:8px;align-items:flex-start}
.say-hint .b{flex:0 0 auto}

/* reco card */
.reco-card{border-radius:20px;padding:24px 22px;color:#fff;position:relative;overflow:hidden;margin-bottom:14px}
.reco-card.p2{background:linear-gradient(135deg,var(--cp-deep),var(--cp-dark))}
.reco-card.p3{background:linear-gradient(135deg,#3a2f6b,#2A3E5F)}
.reco-card.p1{background:linear-gradient(135deg,#5a6b82,#3f4a5f)}
.reco-badge{display:inline-block;background:rgba(255,255,255,.22);border-radius:8px;padding:5px 11px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
.reco-name{font-size:27px;font-weight:900;letter-spacing:-.02em;line-height:1.05}
.reco-freq{font-size:13px;color:rgba(255,255,255,.8);margin-top:3px;font-weight:600}
.reco-price{display:flex;align-items:baseline;gap:9px;margin-top:16px;flex-wrap:wrap}
.reco-price .now{font-size:34px;font-weight:900;letter-spacing:-.02em}
.reco-price .un{font-size:13px;color:rgba(255,255,255,.75);font-weight:600}
.reco-price .old{font-size:15px;text-decoration:line-through;color:rgba(255,255,255,.5)}
.reco-foot{font-size:11.5px;color:var(--cp-soft);margin-top:6px;font-weight:600}
.cls{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-top:1px solid var(--line)}
.cls:first-child{border-top:0}
.cls .n{width:26px;height:26px;border-radius:8px;background:var(--cp-pale);color:var(--cp-deep);font-weight:800;font-size:12px;display:grid;place-items:center;flex:0 0 auto}
.cls .nm{font-weight:800;color:var(--cp-dark);font-size:14.5px}
.cls .ds{font-size:12px;color:var(--ink-soft);margin-top:1px;line-height:1.4}
.cls-warn{background:#FBEFD8;border-radius:10px;padding:9px 12px;font-size:12px;color:var(--warn);font-weight:600;margin-top:8px;line-height:1.4}
.lvl-tag{display:inline-block;font-size:9.5px;font-weight:800;color:#fff;padding:2px 7px;border-radius:6px;letter-spacing:.02em;vertical-align:middle}
.biens{list-style:none;margin:7px 0 0;padding:0}
.biens li{position:relative;padding:3px 0 3px 18px;font-size:12.5px;line-height:1.4;color:var(--ink)}
.biens li::before{content:'✓';position:absolute;left:0;color:var(--ok);font-weight:800;font-size:12px}
.pourqui{margin-top:8px;background:var(--cp-pale);border-radius:9px;padding:7px 10px;font-size:11.5px;line-height:1.4;color:var(--cp-deep);font-weight:600}
/* Idée + toggle parole */
.idea-pill{display:flex;align-items:flex-start;gap:8px;background:#FDF6E3;border:1px solid #ecd9a0;border-radius:11px;padding:9px 12px;margin-bottom:12px;font-size:12.5px;line-height:1.45;color:#7a5a10}
.idea-pill b{color:#5a4210}
.idea-pill .ip-ic{flex:0 0 auto}
.sp-toggle{display:inline-flex;background:var(--cp-pale);border-radius:10px;padding:3px;gap:3px;margin-bottom:12px}
.sp-toggle button{padding:5px 13px;border-radius:8px;font-size:11.5px;font-weight:700;color:var(--ink-mid);transition:.15s}
.sp-toggle button.on{background:#fff;color:var(--cp-deep);box-shadow:0 1px 4px rgba(20,40,80,.15)}
/* Banque d'arguments */
.arg-legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.arg-src{display:inline-block;font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid;line-height:1.4;white-space:nowrap}
.arg-axis{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:800;color:var(--cp-deep);margin-bottom:14px}
.arg-axis-bar{flex:1;height:5px;border-radius:3px;background:linear-gradient(90deg,#185FA5,#0F6E56,#854F0B,#6b40b8)}
.arg-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:10px}
.arg-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px;font-size:13.5px;color:var(--cp-dark)}
.arg-spec{position:relative;height:5px;border-radius:3px;background:linear-gradient(90deg,#185FA522,#0F6E5622,#854F0B22,#6b40b822);margin-bottom:10px}
.arg-spec-bar{position:absolute;inset:0;border-radius:3px;background:linear-gradient(90deg,#185FA5,#0F6E56,#854F0B,#6b40b8);opacity:.25}
.arg-spec-dot{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid var(--cp-deep);transform:translate(-50%,-50%);box-shadow:0 1px 5px rgba(20,40,80,.3)}
/* Prospects & processus de vente */
.obj-grp{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--cp-deep);margin:14px 0 8px;padding-bottom:5px;border-bottom:1px dashed var(--line)}
.menu-count{display:inline-block;background:var(--cp-deep);color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:1px 7px;margin-left:5px;vertical-align:middle}
.pr-capture{background:linear-gradient(135deg,#f0f6ff,#e9f1fb);border:1.5px solid #bcd2ee;border-radius:15px;padding:14px 15px;margin-bottom:14px}
.pr-cap-h{font-size:14px;font-weight:800;color:var(--cp-dark);margin-bottom:10px}
.pr-cap-h small{font-weight:600;color:var(--ink-mid);font-size:11px;margin-left:6px}
.pr-cap-row{display:flex;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.pr-cap-row input[type=text],.pr-cap-row input[type=tel]{flex:1;min-width:130px;padding:10px 12px;border:1.5px solid #c9d8ec;border-radius:10px;font:inherit;font-size:14px;outline:none;background:#fff}
.pr-cap-row input:focus{border-color:var(--cp-deep)}
.pr-cap-lbl{font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:6px}
.pr-cap-sts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.pr-cap-dl{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;color:var(--ink-soft);background:#fff;border:1.5px solid #c9d8ec;border-radius:10px;padding:6px 10px}
.pr-cap-dl input{border:0;outline:none;font:inherit;font-size:13px;color:var(--cp-dark);background:transparent}
.pr-savedbox{background:#e7f6ef;border:1.5px solid #a8dcc4;border-radius:15px;padding:14px 16px;margin-bottom:14px;font-size:13.5px;line-height:1.5;color:#155e43}

/* ── Logo Club Pilates officiel (blanc sur fonds sombres) ── */
.top-brand{height:27px;width:auto;opacity:.95;flex:0 0 auto;pointer-events:none;filter:drop-shadow(0 0 9px rgba(201,135,31,.4)) drop-shadow(0 2px 5px rgba(0,0,0,.3))}
.top-in{position:relative}
@media(max-width:430px){.top-brand{height:24px}}
.lock-brand{height:36px;width:auto;filter:brightness(0) invert(1);opacity:.95;margin:0 auto 18px;display:block}
.ob-brandimg{height:22px;width:auto;filter:brightness(0) invert(1);opacity:.9}
/* ── Verrou studio + synchronisation ── */
#lockScreen,.lock-wrap{position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#0e1526 0%,#16233f 55%,#1c2f55 100%);display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto}
#lockScreen .lock-box,.lock-wrap .lock-box{margin:auto}
.lock-box{width:min(400px,92vw);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:38px 30px;text-align:center;backdrop-filter:blur(14px);box-shadow:0 24px 70px rgba(0,0,0,.45)}
.lock-logo{width:64px;height:64px;margin:0 auto 18px;border-radius:18px;background:linear-gradient(135deg,#C9871F,#e6b45c);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;color:#fff;letter-spacing:1px;box-shadow:0 10px 28px rgba(201,135,31,.4)}
.lock-t{color:#fff;font-size:20px;font-weight:800;margin-bottom:6px}
.lock-s{color:rgba(255,255,255,.65);font-size:13.5px;line-height:1.5;margin-bottom:22px}
#lockCode,#nameInput{width:100%;box-sizing:border-box;padding:14px 16px;border-radius:12px;border:1.5px solid rgba(255,255,255,.25);background:rgba(255,255,255,.09);color:#fff;font-size:17px;letter-spacing:3px;text-align:center;text-transform:uppercase;font-weight:700;outline:none}
#lockCode:focus,#nameInput:focus{border-color:#C9871F;box-shadow:0 0 0 3px rgba(201,135,31,.25)}
#lockCode::placeholder,#nameInput::placeholder{letter-spacing:1px;font-weight:400;color:rgba(255,255,255,.35)}
.lock-btn{width:100%;margin-top:14px;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#C9871F,#b3760f);color:#fff;font-size:15.5px;font-weight:800;cursor:pointer;transition:transform .12s}
.lock-btn:active{transform:scale(.97)}
#lockErr,#nameErr{color:#ff8f8f;font-size:13px;min-height:18px;margin-top:10px;font-weight:600}
.sync-badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:99px;white-space:nowrap;border:1px solid transparent}
.sync-badge.ok{background:#e7f6ef;color:#1F9E75;border-color:#bfe8d6}
.sync-badge.sync{background:#fdf3e3;color:#C9871F;border-color:#f0dcb4}
.sync-badge.off{background:#f2f3f6;color:#8C95A8;border-color:#dde1e8}

.tm-mgr{display:inline-block;background:#fdf3e3;color:#8a5c0a;border:1px solid #f0dcb4;font-size:10px;font-weight:800;border-radius:99px;padding:2px 8px;margin-left:7px;vertical-align:middle}
.tm-code{font-family:ui-monospace,Menlo,monospace;font-weight:800;font-size:12.5px;color:#16233f;background:#f2f4f9;border:1px solid #dde1e8;border-radius:7px;padding:2px 8px;letter-spacing:1px}
/* ── Ligne à dire dans une tuile KPI ── */
.kpi-say{margin-top:8px;background:#effaf4;border:1px solid #cdeadd;border-radius:10px;padding:8px 11px;font-size:12.5px;color:#174e39;font-weight:600;line-height:1.5}
/* ── Avatars : partout à côté du prénom ── */
.cp-ava{display:inline-grid;place-items:center;border-radius:50%;overflow:hidden;flex:0 0 auto;vertical-align:middle;box-shadow:0 2px 8px -2px rgba(26,36,58,.35);line-height:1}
.cp-ava img{width:100%;height:100%;object-fit:cover;display:block}
.cp-ava.init{background:linear-gradient(135deg,var(--cp-soft),var(--cp-deep));color:#fff;font-weight:800}
#topTimer{color:var(--gold-soft);font-weight:800;font-variant-numeric:tabular-nums}
#topAva{margin-right:2px}
#topAva .cp-ava{border:2px solid rgba(255,255,255,.35)}
.pf-tn{display:flex;align-items:center;gap:6px}
.pr-rep{display:inline-flex;align-items:center;gap:4px}
.av-box{width:min(440px,94vw)}
.av-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin:4px 0 2px}
.av-grid.img5{grid-template-columns:repeat(5,1fr);gap:12px;align-items:start}
.av-cell.pic{display:block;background:#fff;padding:0;overflow:hidden;aspect-ratio:auto;height:auto;line-height:0;font-size:0}
.av-cell.pic img{width:100%;height:auto;display:block;border-radius:50%}
.tm-studio{display:inline-block;background:#eef3fb;color:#4F6FA0;border:1px solid #d8e2f5;font-size:10.5px;font-weight:700;border-radius:99px;padding:2px 8px}
.av-cell{position:relative;width:100%;aspect-ratio:1;border-radius:50%;font-size:26px;display:grid;place-items:center;border:2.5px solid transparent;transition:transform .22s cubic-bezier(.3,1.5,.4,1),border-color .15s,box-shadow .22s;cursor:pointer;z-index:0}
.av-cell:hover{transform:scale(2.05);border-color:#fff;box-shadow:0 22px 50px -8px rgba(0,0,0,.7);z-index:6}
.av-cell:active{transform:scale(1.85);z-index:6}
.av-or{display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.45);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin:14px 0 10px}
.av-or span{flex:1;height:1px;background:rgba(255,255,255,.18)}
.av-photo{display:block;width:100%;padding:13px;border-radius:12px;border:1.5px dashed rgba(255,255,255,.35);color:#fff;font-size:14px;font-weight:800;cursor:pointer;transition:background .15s}
.av-photo:hover{background:rgba(255,255,255,.08)}
.av-photo input{display:none}
.set-ava{width:100%;margin-top:4px;padding:11px;border:1.5px solid var(--line);border-radius:11px;background:var(--cp-veil);font-size:13.5px;font-weight:700;color:var(--cp-deep)}
/* ── Performances : gamification ── */
@keyframes pfin{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.pf-hero,.pf-prime,.pf-funnel,.pf-team,.pf-primeset{animation:pfin .55s cubic-bezier(.22,1.2,.35,1) both}
.pf-prime{animation-delay:.12s}
.pf-funnel{animation-delay:.22s}
.pf-team{animation-delay:.3s}
.pf-frow{animation:pfin .5s cubic-bezier(.22,1.2,.35,1) both}
.pf-hero{background:linear-gradient(150deg,#26385A,#1E2E4C);border-radius:20px;padding:20px 18px;color:#fff;margin-bottom:12px;box-shadow:0 16px 40px -14px rgba(30,46,76,.5);position:relative;overflow:hidden}
.pf-hero::after{content:'';position:absolute;inset:0;background:radial-gradient(400px 180px at 90% -20%,rgba(255,255,255,.12),transparent 60%);pointer-events:none}
.pf-hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.pf-badge{background:var(--lc);border-radius:13px;padding:9px 16px;font-weight:900;font-size:19px;box-shadow:0 6px 18px -6px rgba(0,0,0,.4);animation:pffloat 3.2s ease-in-out infinite}
@keyframes pffloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.pf-badge small{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.9}
.pf-abos{text-align:right}
.pf-abos b{font-size:34px;font-weight:900;letter-spacing:-.02em}
.pf-abos small{display:block;font-size:11px;color:rgba(255,255,255,.65);font-weight:600}
.pf-track{height:12px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden}
.pf-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-soft));border-radius:99px;transition:width 1.25s cubic-bezier(.3,1.25,.4,1) .25s;position:relative;box-shadow:0 0 14px rgba(230,180,92,.55)}
.pf-fill::before{content:'';position:absolute;right:-2px;top:50%;width:10px;height:10px;border-radius:50%;background:#fff;transform:translateY(-50%);box-shadow:0 0 12px 4px rgba(255,235,190,.9);animation:pftip 1.6s ease-in-out infinite}
@keyframes pftip{0%,100%{opacity:.9;box-shadow:0 0 10px 3px rgba(255,235,190,.8)}50%{opacity:1;box-shadow:0 0 18px 7px rgba(255,235,190,.95)}}
.pf-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.5) 50%,transparent 60%);animation:pfshine 2.4s infinite}
@keyframes pfshine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.pf-next{font-size:12.5px;color:rgba(255,255,255,.85);margin-top:9px;font-weight:600}
.pf-lvls{display:flex;align-items:center;margin-top:12px}
.pf-lvl{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.2);display:grid;place-items:center;font-size:11.5px;font-weight:800;color:rgba(255,255,255,.45);flex:0 0 auto;animation:pflvl .45s cubic-bezier(.3,1.6,.4,1) both}
@keyframes pflvl{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
.pf-lvl.cur{animation:pflvl .45s cubic-bezier(.3,1.6,.4,1) both,pfring 2s ease-out .9s infinite}
@keyframes pfring{0%{box-shadow:0 4px 12px -3px rgba(201,135,31,.6),0 0 0 0 rgba(230,180,92,.65)}70%{box-shadow:0 4px 12px -3px rgba(201,135,31,.6),0 0 0 12px rgba(230,180,92,0)}100%{box-shadow:0 4px 12px -3px rgba(201,135,31,.6),0 0 0 0 rgba(230,180,92,0)}}
.pf-lvl.on{background:linear-gradient(135deg,var(--gold),var(--gold-soft));border-color:transparent;color:#fff;box-shadow:0 4px 12px -3px rgba(201,135,31,.6)}
.pf-lsep{flex:1;height:2px;background:rgba(255,255,255,.15)}
.pf-prime{display:flex;gap:12px;background:linear-gradient(135deg,#fdf8ee,#faf3e2);border:1.5px solid #e8d5a8;border-radius:17px;padding:16px;margin-bottom:6px}
.pf-prime-main{flex:1}
.pf-prime-lbl{font-size:12px;font-weight:800;color:#8a5c0a;text-transform:uppercase;letter-spacing:.04em}
.pf-prime-n{font-size:36px;font-weight:900;color:#6b4d0d;letter-spacing:-.02em;line-height:1.1;margin:4px 0 8px}
.pf-pks{display:flex;flex-wrap:wrap;gap:6px}
.pf-pk{background:#fff;border:1px solid #eee3c8;border-radius:99px;padding:4px 11px;font-size:11.5px;font-weight:700;color:#6b5325}
.pf-pk b{color:#1F9E75}
.pf-pk.muted{color:#a08c5a;font-weight:600;border-style:dashed}
.pf-prime-side{flex:0 0 auto;text-align:right;border-left:1px dashed #e0cd9d;padding-left:14px;display:flex;flex-direction:column;justify-content:center;font-size:11px;color:#a07c2a;font-weight:700}
.pf-prime-side b{font-size:21px;color:#6b4d0d;margin:2px 0}
.pf-bareme{font-size:11px;color:#8C95A8;font-weight:600;margin-bottom:16px;padding-left:4px}
.pf-sec{font-size:14px;font-weight:800;color:var(--cp-dark);margin-bottom:10px}
.pf-sec small{font-weight:600;color:#8C95A8;font-size:11px;margin-left:6px}
.pf-funnel{background:#fff;border:1px solid #EBEFF6;border-radius:16px;padding:15px;box-shadow:var(--sh-s)}
.pf-frow{display:grid;grid-template-columns:130px 1fr 58px;gap:10px;align-items:center;margin-bottom:10px}
.pf-flbl{font-size:12px;font-weight:700;color:#3c4759}
.pf-ftrack{height:14px;background:#EEF1F7;border-radius:99px;overflow:hidden}
.pf-ffill{height:100%;border-radius:99px;transition:width 1.1s cubic-bezier(.3,1.25,.4,1);position:relative;overflow:hidden}
.pf-ffill::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.45) 50%,transparent 60%);animation:pfshine 2.8s infinite}
.pf-fnum{text-align:right;font-size:13px;color:var(--cp-dark)}
.pf-fnum small{display:block;font-size:10px;color:#8C95A8;font-weight:700}
.pf-conv{border-top:1px dashed #E3E9F2;margin-top:4px;padding-top:10px;font-size:12.5px;color:#3c4759}
.pf-conv b{color:#1F9E75}
/* Badges à collectionner */
.bd-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:420px){.bd-grid{grid-template-columns:repeat(2,1fr)}}
.bd-card{background:#fff;border:1.5px solid #EBEFF6;border-radius:15px;padding:13px 10px 11px;text-align:center;box-shadow:var(--sh-s);animation:pfin .5s cubic-bezier(.22,1.2,.35,1) both;position:relative;overflow:hidden}
.bd-card .bd-ic{font-size:30px;line-height:1;margin-bottom:7px;filter:grayscale(1);opacity:.45}
.bd-card .bd-t{font-size:12px;font-weight:800;color:#8C95A8}
.bd-card .bd-d{font-size:10.5px;color:#a3abbd;line-height:1.35;margin-top:3px;min-height:26px}
.bd-card.ok{border-color:#EDD8AC;background:linear-gradient(160deg,#fffdf7,#fdf4e0)}
.bd-card.ok::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.6) 50%,transparent 60%);animation:pfshine 3.2s infinite;pointer-events:none}
.bd-card.ok .bd-ic{filter:none;opacity:1;animation:pflvl .5s cubic-bezier(.3,1.6,.4,1) both}
.bd-card.ok .bd-t{color:#6b4d0d}
.bd-card.ok .bd-d{color:#a07c2a}
.bd-won{margin-top:7px;font-size:10px;font-weight:800;color:#1F9E75;background:#e7f6ef;border-radius:99px;padding:3px 9px;display:inline-block}
.bd-bar{height:5px;background:#EEF1F7;border-radius:99px;margin-top:8px;overflow:hidden}
.bd-fill{height:100%;background:linear-gradient(90deg,var(--cp-soft),var(--cp-deep));border-radius:99px;transition:width 1s cubic-bezier(.3,1.25,.4,1) .4s}
.bd-prog{font-size:9.5px;font-weight:700;color:#8C95A8;margin-top:4px}
.pf-team{background:#fff;border:1px solid #EBEFF6;border-radius:16px;padding:6px 0;box-shadow:var(--sh-s);overflow-x:auto}
.pf-th,.pf-tr{display:grid;grid-template-columns:minmax(90px,1.4fr) repeat(7,minmax(48px,1fr));gap:4px;align-items:center;padding:9px 14px;font-size:12px;min-width:540px}
.pf-th{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#8C95A8;border-bottom:1px solid #EEF1F7}
.pf-tr{border-bottom:1px solid #F4F6FA;color:#3c4759}
.pf-tr:last-child{border-bottom:0}
.pf-tr.me{background:#F7FAF5}
.pf-tn{font-weight:800;color:var(--cp-dark)}
.pf-tp{font-weight:800;color:#1F9E75}
.pf-primeset{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid #EBEFF6;border-radius:14px;padding:13px 15px;box-shadow:var(--sh-s)}
.pf-primeset label{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:#3c4759}
.pf-primeset input{width:64px;padding:8px;border:1.5px solid #E3E9F2;border-radius:9px;font:inherit;font-size:14px;text-align:center;outline:none}
/* ── Choix du pack souscrit ── */
.pr-pack-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.pr-pack{display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px solid #e3e7ef;background:#fff;border-radius:10px;padding:8px 4px;font-size:12.5px;font-weight:800;color:#3c4759;transition:all .13s}
.pr-pack small{font-size:10px;font-weight:600;color:#8C95A8}
.pr-pack.on{background:#1F9E75;border-color:#1F9E75;color:#fff}
.pr-pack.on small{color:rgba(255,255,255,.8)}
.pr-pack.sm{flex-direction:row;padding:5px 10px;font-size:11px;border-radius:99px}
.pr-packline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pr-pack-ask{font-size:11.5px;font-weight:700;color:#C9871F}
/* ── Guide de bienvenue (onboarding) ── */
#obScreen{position:fixed;inset:0;z-index:9998;background:linear-gradient(165deg,#1c2b4a 0%,#26385A 55%,#2e4470 100%);overflow-y:auto;animation:obfade .3s}
@keyframes obfade{from{opacity:0}to{opacity:1}}
.ob-in{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom))}
.ob-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.ob-brand{display:flex;align-items:center;gap:9px;color:rgba(255,255,255,.85);font-size:13px;font-weight:700}
.ob-logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--gold),var(--gold-soft));display:grid;place-items:center;font-weight:900;font-size:12px;color:#fff}
.ob-skip{color:rgba(255,255,255,.55);font-size:12.5px;font-weight:700;padding:6px 10px;border-radius:9px}
.ob-skip:active{background:rgba(255,255,255,.1)}
.ob-dots{display:flex;gap:7px;justify-content:center;margin-bottom:18px}
.ob-dot{width:8px;height:8px;border-radius:99px;background:rgba(255,255,255,.22);transition:.25s}
.ob-dot.on{width:26px;background:var(--gold-soft)}
.ob-dot.done{background:rgba(230,180,92,.55)}
.ob-card{flex:1;background:#fff;border-radius:22px;padding:26px 22px;box-shadow:0 24px 60px -20px rgba(0,0,0,.5);animation:pop .3s}
.ob-ic{font-size:38px;line-height:1;margin-bottom:10px}
.ob-t{font-size:22px;font-weight:800;color:var(--cp-dark);letter-spacing:-.02em;margin-bottom:16px;line-height:1.2}
.ob-row{display:flex;gap:11px;align-items:flex-start;font-size:14px;color:#3c4759;line-height:1.6;padding:10px 0;border-top:1px dashed #E3E9F2}
.ob-row:first-of-type{border-top:0;padding-top:0}
.ob-ri{flex:0 0 24px;font-size:18px;margin-top:1px}
.ob-row b{color:var(--cp-dark)}
.ob-lead{font-family:var(--serif);font-style:italic;font-size:17px;line-height:1.5;color:var(--cp-dark);border-left:3px solid var(--gold);padding:4px 0 4px 14px;margin-bottom:16px}
.ob-why{margin-top:7px;font-size:13px;color:#5b6579;line-height:1.55}
.ob-why b{color:#8a5c0a}
.ob-geste{margin-top:7px;font-size:12.5px;font-weight:700;color:#1F9E75;background:#effaf4;border-radius:9px;padding:6px 10px;display:inline-block}
.ob-foot{margin-top:14px;background:linear-gradient(135deg,#fdf8ee,#faf3e2);border:1px solid #EDDCB4;border-radius:12px;padding:11px 14px;font-size:13px;font-weight:700;color:#6b5325;line-height:1.55}
.ob-nav{display:flex;gap:10px;margin-top:16px}
.ob-back{flex:0 0 56px;border-radius:14px;background:rgba(255,255,255,.14);color:#fff;font-size:20px;font-weight:700}
.ob-next{flex:1;border-radius:14px;background:linear-gradient(135deg,var(--gold),#b3760f);color:#fff;font-weight:800;font-size:15.5px;padding:15px;box-shadow:0 10px 26px -8px rgba(201,135,31,.55);transition:transform .13s}
.ob-next:active{transform:scale(.98)}
.ht-tile.gold{border-color:#EDD8AC;background:linear-gradient(160deg,#fffdf7,#fdf6e6)}
/* ── Accueil : la course du mois ── */
.hp-box{margin-top:14px;background:linear-gradient(150deg,#26385A,#1E2E4C);border-radius:17px;padding:15px 16px;color:#fff;box-shadow:0 14px 34px -12px rgba(30,46,76,.45);animation:pfin .5s cubic-bezier(.22,1.2,.35,1) both}
.hp-h{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;font-weight:800;margin-bottom:8px}
.hp-more{color:var(--gold-soft);font-size:11px;font-weight:800;padding:4px 8px;border-radius:8px}
.hp-more:active{background:rgba(255,255,255,.1)}
.hp-head{font-size:12px;color:rgba(255,255,255,.85);line-height:1.5;margin-bottom:11px}
.hp-head b{color:var(--gold-soft)}
.hp-row{display:flex;align-items:center;gap:8px;padding:5px 0}
.hp-row.me{background:rgba(230,180,92,.12);border-radius:10px;padding:5px 7px;margin:0 -7px}
.hp-rank{flex:0 0 26px;font-size:13px;font-weight:800;text-align:center;color:rgba(255,255,255,.75)}
.hp-name{flex:0 0 auto;min-width:64px;font-size:12.5px;font-weight:700}
.hp-name small{color:var(--gold-soft);font-weight:700}
.hp-track{flex:1;height:7px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden}
.hp-fill{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-soft));border-radius:99px;transition:width .9s cubic-bezier(.3,1.25,.4,1)}
.hp-val{flex:0 0 auto;text-align:right;font-size:12.5px;font-weight:800;min-width:44px}
.hp-val small{display:block;font-size:9px;font-weight:600;color:rgba(255,255,255,.55)}
.hp-load{font-size:12px;color:rgba(255,255,255,.6);padding:6px 0}
/* ── Accueil hub ── */
.hm-today{display:flex;gap:8px;overflow-x:auto;padding-bottom:3px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.hm-today::-webkit-scrollbar{display:none}
.hm-chip{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #E3E9F2;border-radius:13px;padding:10px 13px;font-size:12.5px;font-weight:700;color:var(--ink);box-shadow:var(--sh-s);cursor:pointer}
.hm-chip b{font-size:15px;color:var(--cp-dark)}
.hm-chip.hot{border-color:var(--gold);background:linear-gradient(135deg,#FFF9EE,#FDF3DE)}
.hm-chip .hc-ic{font-size:17px}
.hm-sec{font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-mid);margin:20px 0 9px;display:flex;align-items:center;gap:8px}
.hm-sec::after{content:'';flex:1;height:1px;background:#E3E9F2}
.hm-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hm-big{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:#fff;border:1.5px solid #E3E9F2;border-radius:16px;padding:15px 14px;box-shadow:var(--sh-s);text-align:left;transition:transform .15s,box-shadow .15s}
.hm-big .ic{font-size:23px}
.hm-big .l{font-size:14.5px;font-weight:800;color:var(--cp-dark)}
.hm-big .s{font-size:11px;font-weight:600;color:var(--ink-mid);line-height:1.35}
.hm-big.call{background:linear-gradient(135deg,var(--cp-deep),var(--cp-dark));border-color:var(--cp-dark)}
.hm-big.call .l{color:#fff}
.hm-big.call .s{color:rgba(255,255,255,.78)}
.hm-count{position:absolute;top:10px;right:10px;background:var(--cp-pale);color:var(--cp-dark);font-size:11px;font-weight:800;border-radius:99px;padding:2px 8px}
.ht-prog{position:absolute;left:12px;right:12px;bottom:5px;height:4px;background:#EDF1F7;border-radius:99px;overflow:hidden}
.ht-prog span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-soft));border-radius:99px}
@media(hover:hover){.hm-big:hover{transform:translateY(-2px);box-shadow:var(--sh-m)}.hm-chip:hover{transform:translateY(-1px)}}
/* ── Accueil : boîte à outils + credo ── */
.home-tools{margin-top:18px}
.ht-h{font-size:13px;font-weight:800;color:var(--cp-dark);margin-bottom:10px}
.ht-h small{display:block;font-weight:600;font-size:11px;color:var(--ink-mid);margin-top:2px}
.ht-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
@media(max-width:380px){.ht-grid{grid-template-columns:repeat(2,1fr)}}
.ht-tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;border:1.5px solid #E3E9F2;border-radius:14px;padding:14px 6px 11px;box-shadow:var(--sh-s);transition:transform .15s,box-shadow .15s,border-color .15s}
.ht-tile:active{transform:scale(.96)}
@media(hover:hover){.ht-tile:hover{transform:translateY(-2px);box-shadow:var(--sh-m);border-color:var(--cp-soft)}}
.ht-ic{font-size:22px;line-height:1}
.ht-lbl{font-size:11.5px;font-weight:700;color:var(--cp-dark);text-align:center;line-height:1.2}
.ht-count{position:absolute;top:6px;right:8px;background:var(--gold);color:#fff;font-size:10px;font-weight:800;border-radius:99px;padding:1px 7px}
.home-creed{margin-top:14px;background:linear-gradient(135deg,#fdf8ee,#faf3e2);border:1px solid #EDDCB4;border-left:4px solid var(--gold);border-radius:13px;padding:12px 15px;font-size:12.5px;line-height:1.55;color:#6b5325}
.home-creed b{color:#523d12}
/* ── Import de leads ── */
.li-area{width:100%;min-height:180px;border:1.5px solid #E3E9F2;border-radius:14px;padding:13px 15px;font:13px/1.6 ui-monospace,Menlo,monospace;color:var(--cp-dark);background:#fff;outline:none;resize:vertical;box-shadow:var(--sh-s)}
.li-area:focus{border-color:var(--cp-deep)}
.li-prev{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;min-height:22px}
.li-ok,.li-dup,.li-bad{font-size:12px;font-weight:800;border-radius:99px;padding:4px 11px}
.li-ok{background:#e7f6ef;color:#1F9E75}
.li-dup{background:#f2f3f6;color:#8C95A8}
.li-bad{background:#fdecea;color:#a93226}
/* ── Intro Class ── */
.ic-studio{border:1.5px solid #E3E9F2;border-radius:10px;padding:8px 10px;font:inherit;font-size:12.5px;font-weight:700;color:var(--cp-deep);background:#fff;max-width:200px}
.ic-week{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #EBEFF6;border-radius:13px;padding:9px 12px;margin-bottom:12px;box-shadow:var(--sh-s)}
.ic-week b{flex:1;text-align:center;font-size:13.5px;color:var(--cp-dark)}
.ic-week button{width:34px;height:34px;border-radius:9px;background:var(--cp-veil);font-size:16px;font-weight:800;color:var(--cp-deep)}
.ic-week .ic-today{width:auto;padding:0 12px;font-size:11px}
.ic-day{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#8C95A8;margin:12px 0 7px}
.ic-card{background:#fff;border:1px solid #EBEFF6;border-left:4px solid var(--cp-deep);border-radius:14px;padding:12px 14px;margin-bottom:9px;box-shadow:var(--sh-s)}
.ic-card.ann{opacity:.55;border-left-color:#8C95A8}
.ic-top{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.ic-when b{font-size:16px;color:var(--cp-dark)}
.ic-when span{display:block;font-size:10.5px;color:#8C95A8;font-weight:700}
.ic-coach{flex:1;min-width:0;border:1px solid #E3E9F2;border-radius:9px;padding:8px 10px;font:inherit;font-size:13px;font-weight:600;color:var(--cp-dark);background:#FAFBFD;outline:none}
.ic-st{display:flex;gap:4px}
.ic-stb{width:32px;height:32px;border-radius:9px;background:#F2F4F9;font-size:14px;opacity:.5}
.ic-stb.on{opacity:1;background:var(--cp-pale);box-shadow:inset 0 0 0 1.5px var(--cp-deep)}
.ic-counts{display:flex;align-items:center;gap:12px;margin-bottom:9px}
.ic-cnt span{font-size:10px;font-weight:800;text-transform:uppercase;color:#8C95A8}
.ic-cnt div{display:flex;align-items:center;gap:7px;margin-top:3px}
.ic-cnt button{width:30px;height:30px;border-radius:9px;background:var(--cp-veil);font-size:16px;font-weight:800;color:var(--cp-deep)}
.ic-cnt b{min-width:22px;text-align:center;font-size:17px;color:var(--cp-dark)}
.ic-pct{margin-left:auto;text-align:right;font-size:19px;font-weight:900;color:#1F9E75}
.ic-pct small{display:block;font-size:9px;font-weight:700;color:#8C95A8}
.ic-sales{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-top:1px dashed #E3E9F2;padding-top:8px}
.ic-sale{background:#e7f6ef;border:1px solid #bfe8d6;color:#155e43;font-size:11px;font-weight:700;border-radius:99px;padding:3px 9px}
.ic-nosale{font-size:11px;color:#a3abbd}
.ic-addsale{margin-left:auto;background:var(--cp-deep);color:#fff;font-size:11.5px;font-weight:800;border-radius:9px;padding:6px 11px}
.ic-annmsg{font-size:12px;color:#8C95A8;font-style:italic}

.tr-sec{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:18px 2px 9px}

.gl{border-bottom:1.5px dashed var(--gold);background:linear-gradient(180deg,transparent 72%,rgba(201,135,31,.22) 72%);cursor:help;border-radius:2px;transition:background .15s}

#who-nom{font-weight:700;color:var(--cp-dark)}
/* ── Offre fondateur (closing) ── */
.fond-box{background:linear-gradient(135deg,#fdf8ee,#faf3e2);border:1.5px solid #e8d5a8;border-radius:15px;padding:14px 15px;margin-top:12px}
.fond-h{font-size:14px;font-weight:800;color:#6b4d0d;margin-bottom:10px}
.fond-hs{display:block;font-size:11px;font-weight:700;color:#a07c2a;margin-top:2px}
.fond-row{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #eee3c8;border-radius:11px;padding:9px 12px;margin-bottom:7px;flex-wrap:wrap}
.fond-row.cur{border-color:#C9871F;box-shadow:0 3px 12px rgba(201,135,31,.18)}
.fond-pack{flex:1;min-width:120px;font-size:12.5px;font-weight:800;color:#16233f}
.fond-reco{background:#C9871F;color:#fff;font-size:9px;font-weight:800;border-radius:99px;padding:2px 7px;margin-left:6px;text-transform:uppercase;vertical-align:middle}
.fond-prix{font-size:14px;color:#16233f;white-space:nowrap}
.fond-prix s{color:#a3abbd;font-size:12px;margin-right:5px}
.fond-prix b{color:#8a5c0a;font-size:16px}
.fond-prix small{color:#8C95A8;font-size:10.5px;margin-left:2px}
.fond-per{flex-basis:100%;font-size:11.5px;font-weight:700;color:#1F9E75}
.fond-note{flex-basis:100%;font-size:11px;font-weight:700;color:#8a5c0a;background:#fdf3e3;border-radius:8px;padding:5px 9px;margin-top:2px}
.fond-ref{font-size:11.5px;color:#8a6d2e;margin-top:6px;line-height:1.5}
.fond-why{background:#fff;border:1.5px solid var(--line,#e3e7ef);border-radius:15px;padding:13px 15px;margin-top:10px}
.fond-why-h{font-size:13.5px;font-weight:800;color:#16233f;margin-bottom:9px}
.fw-row{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:#3c4759;line-height:1.55;margin-bottom:8px}
.fw-ic{flex:0 0 20px;font-size:15px;margin-top:1px}
/* ── Page prospects : DA CRM ── */
.pr-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.pr-h2{margin:0;font-size:22px;color:#16233f}
.pr-h2s{font-size:12.5px;color:#8C95A8;margin-top:3px}
.pr-howto{background:linear-gradient(135deg,#f2f6ff,#eef2fb);border:1px solid #d8e2f5;border-radius:14px;padding:12px 16px;margin-bottom:14px}
.pr-howto summary{cursor:pointer;font-weight:800;font-size:13.5px;color:#185FA5;list-style:none}
.pr-howto summary::-webkit-details-marker{display:none}
.pr-howto-b{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.pr-howto-b>div{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#3c4759;line-height:1.5}
.hn{flex:0 0 22px;height:22px;border-radius:50%;background:#185FA5;color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.pr-alert{background:linear-gradient(135deg,#fff7e8,#fdf0d8);border:1px solid #f0d9a8;border-radius:12px;padding:11px 15px;font-size:13.5px;color:#8a5c0a;margin-bottom:14px}
.pr-funnel{display:flex;align-items:stretch;gap:4px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
.pr-fun{flex:1;min-width:64px;border:1.5px solid #e3e7ef;background:#fff;border-radius:14px;padding:10px 4px 8px;text-align:center;cursor:pointer;transition:all .15s;position:relative}
.pr-fun:hover{border-color:var(--pc)}
.pr-fun.active{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 8%,#fff);box-shadow:0 4px 14px color-mix(in srgb,var(--pc) 25%,transparent)}
.pr-fun-n{font-size:21px;font-weight:900;color:var(--pc);line-height:1.1}
.pr-fun-l{font-size:10px;font-weight:700;color:#5b6579;margin-top:3px;white-space:nowrap}
.pr-arrow{align-self:center;color:#c4cad6;font-weight:700;font-size:15px}
.pr-search{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #e3e7ef;border-radius:12px;padding:9px 13px;margin-bottom:14px}
.pr-search input{flex:1;border:none;outline:none;font-size:14px;background:transparent;color:#16233f}
.pr-clearf{border:none;background:#f2f3f6;color:#5b6579;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:99px;cursor:pointer;white-space:nowrap}
.pr-card{background:#fff;border:1px solid #e7eaf1;border-radius:14px;padding:14px 15px;margin-bottom:12px;box-shadow:0 2px 10px rgba(22,35,63,.05)}
.hs-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:10px}
.hs-k{background:#fff;border:1px solid #E3E8F1;border-radius:10px;padding:7px 4px;text-align:center}
.hs-k b{display:block;font-size:13.5px;color:var(--cp-dark)}.hs-k span{font-size:10.5px;color:var(--ink-mid);font-weight:600}
.hs-load{font-size:12.5px;color:var(--ink-mid);padding:8px 2px}
.hs-list{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto;padding-right:2px}
.hs-it{display:flex;gap:9px;background:#fff;border:1px solid #E7EAF1;border-radius:10px;padding:8px 10px}
.hs-ic{font-size:17px;line-height:1.2}.hs-b{flex:1;min-width:0}
.hs-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;color:var(--cp-dark)}
.hs-src{font-size:9.5px;font-weight:800;border-radius:99px;padding:1px 6px;text-transform:uppercase;letter-spacing:.04em}
.hs-src.a{background:#EAF6F0;color:#1F7A55}.hs-src.c{background:#FFF1E6;color:#B4541A}.hs-src.b{background:#EEF2FB;color:#2A3F6B}
.hs-who{font-size:11px;color:var(--ink-mid);font-weight:700}.hs-d{margin-left:auto;font-size:11px;color:var(--ink-mid)}
.hs-s{font-size:12px;color:#55607A;margin-top:2px}.hs-t{font-size:12.5px;color:#333B4E;margin-top:4px;white-space:pre-wrap;line-height:1.45}
.hs-more{margin-top:5px;font-size:11.5px;font-weight:700;color:var(--cp-deep);background:none;border:0;padding:0;cursor:pointer}
@media(max-width:520px){.hs-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pr-new{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:9px 14px;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 8px 18px -10px rgba(75,82,230,.8)}
.pl-form select{border:1px solid var(--cream-line);border-radius:9px;padding:7px 9px;font:inherit;font-size:13px;color:var(--ink);background:#fff;text-transform:none;letter-spacing:0;font-weight:500}
.pl-note{position:relative;margin:0 0 4px}
.pl-note textarea{display:block;width:100%;box-sizing:border-box;min-height:58px;border:1px solid var(--cream-line);border-radius:12px;padding:8px 10px 30px;font:inherit;font-size:13px;line-height:1.45;resize:vertical;background:#fff;color:var(--ink)}
.pl-note textarea:focus{outline:none;border-color:var(--lav-ink);box-shadow:0 0 0 3px var(--lav)}
.pl-note-btn{position:absolute;right:7px;bottom:7px;border:0;border-radius:8px;padding:5px 11px;font-size:11.5px;font-weight:800;background:var(--lav);color:var(--lav-ink);cursor:pointer;transition:background .15s,color .15s}
.pl-note-btn.on{background:var(--accent);color:#fff}
.pl-hint{font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink-mid);font-size:10.5px;margin-left:4px}
.src-ic{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;margin-right:7px;vertical-align:-3px;font-size:11px;line-height:1;box-shadow:0 0 0 1px rgba(0,0,0,.06);flex:0 0 auto}
.src-ic svg{width:14px;height:14px}
.src-txt{font-size:10px;font-weight:700;color:var(--ink-mid);background:#F6F4EE;border-radius:5px;padding:1px 5px;margin-right:6px;vertical-align:1px}
.pl-arr{white-space:nowrap}
.pl-done{display:inline-flex;align-items:center;gap:5px;margin-left:8px;font-size:11px;font-weight:800;color:#1F7A55;background:#EAF6F0;border:1px solid #BFE8D6;border-radius:99px;padding:2px 9px 2px 6px;cursor:pointer;white-space:nowrap;vertical-align:1px}
.pl-done input{width:14px;height:14px;margin:0;accent-color:#1F9E75;cursor:pointer}
.pl-done:hover{background:#DDF1E6}
.pl-edit{margin-left:8px;border:1px solid var(--cream-line);background:#fff;border-radius:8px;padding:2px 8px;font-size:10.5px;font-weight:700;color:var(--lav-ink);cursor:pointer;text-transform:none;letter-spacing:0}
.pl-form{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;background:var(--cream);border:1px solid var(--cream-line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.pl-form label{display:flex;flex-direction:column;gap:3px;font-size:10.5px;font-weight:800;color:var(--ink-mid);text-transform:uppercase;letter-spacing:.05em}
.pl-form label.wide{grid-column:1/-1}
.pl-form input,.pl-form textarea{border:1px solid var(--cream-line);border-radius:9px;padding:7px 9px;font:inherit;font-size:13px;color:var(--ink);background:#fff;text-transform:none;letter-spacing:0;font-weight:500}
.pl-form textarea{resize:vertical}
@media(max-width:640px){.pl-form{grid-template-columns:1fr}}
.hs-next{display:flex;gap:9px;background:#FFF8EC;border:1px solid #F0D9A8;border-radius:10px;padding:9px 11px;margin-bottom:8px}
.hs-next.late{background:#FDF1EE;border-color:#F5C0AE}
.jr-tr{flex:0 0 auto;border:1px solid var(--cream-line);background:#fff;border-radius:9px;padding:4px 9px;font-size:11.5px;font-weight:700;color:var(--lav-ink);cursor:pointer;white-space:nowrap}
.jr-tr:hover{background:var(--lav)}
.jr-tr.off{opacity:.28;cursor:default;border-color:transparent;background:transparent;padding:4px 6px}
.dg{background:#fff;border:1px solid var(--cream-line);border-radius:18px;padding:12px 16px;margin:8px 0 0;box-shadow:var(--sh-s)}
.dg-h{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13px;color:var(--ink)}
.dg-k{cursor:pointer;background:var(--cream);border-radius:99px;padding:3px 11px;font-size:12.5px;color:var(--ink-soft)}
.dg-k:hover{background:var(--lav)}.dg-k.hot{background:#FFF1E6;color:#B4541A}
.dg-bar{height:7px;border-radius:99px;background:var(--cream);margin:10px 0 7px;overflow:hidden}
.dg-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),#7C83F0);transition:width .6s}
.dg-f{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12px;color:var(--ink-mid)}
.dg-rep{display:inline-flex;align-items:center;gap:4px;color:var(--ink-soft)}
.dg-goal{margin-left:auto;display:inline-flex;align-items:center;gap:6px}
.dg-goal input{width:58px;border:1px solid var(--cream-line);border-radius:8px;padding:3px 6px;font:inherit;font-size:12px;text-align:center}
.pl-btn.sms{background:#EAF6F0;border-color:#BFE8D6}
.pr-tabn{display:inline-block;min-width:16px;font-size:10.5px;font-weight:800;color:var(--ink-mid);background:var(--cream);border-radius:99px;padding:0 6px;margin-left:3px}
.pr-tab.on .pr-tabn{background:rgba(255,255,255,.22);color:#fff}
.pr-rdvb{display:inline-block;min-width:18px;background:#E0452B;color:#fff;border-radius:99px;padding:0 6px;font-size:11px;font-weight:800;margin-left:4px;animation:prBlink 1.1s ease-in-out infinite}
@keyframes prBlink{50%{opacity:.3}}
.pr-card.rdv-hot{animation:prGlow 1.4s ease-in-out infinite}
@keyframes prGlow{50%{box-shadow:0 0 0 3px rgba(224,69,43,.35),0 4px 18px rgba(224,69,43,.25)}}
.pr-bbs{display:flex;flex-wrap:wrap;gap:4px;margin:3px 0 2px}
.pr-bb{font-size:10.5px;font-weight:700;border:1px solid;border-radius:99px;padding:1px 7px;white-space:nowrap}
.pr-bnotes{margin:6px 0 2px;font-size:12.5px;color:var(--ink-mid);background:#F7F8FB;border:1px solid #E7EAF1;border-radius:10px;padding:6px 10px}
.pr-bnotes summary{cursor:pointer;font-weight:700;color:var(--ink)}
.pr-bnotes div{margin-top:5px;white-space:pre-wrap;max-height:180px;overflow:auto}
.pr-card.due{box-shadow:0 4px 18px rgba(201,135,31,.18);border-color:#f0d9a8}
.pr-top{display:flex;align-items:center;gap:11px;margin-bottom:8px}
.pr-ava{flex:0 0 40px;height:40px;border-radius:50%;color:#fff;font-weight:800;font-size:14.5px;display:flex;align-items:center;justify-content:center;letter-spacing:.5px}
.pr-idbox{flex:1;min-width:0}
.pr-id b{font-size:15.5px;color:#16233f}
.pr-sub{font-size:12.5px;color:#8C95A8;display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.pr-tel{color:#185FA5;text-decoration:none;font-weight:600}
.pr-rep{color:#a3abbd}
.pr-chip{font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px;border:1px solid;white-space:nowrap}
.pr-obj,.pr-note{font-size:13px;color:#3c4759;line-height:1.45;margin:5px 0;background:#f7f8fb;border-radius:9px;padding:7px 11px}
.pr-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:#8C95A8;margin:8px 0 10px}
.pr-due{color:#C9871F;font-weight:800}
.pr-pipe{display:flex;gap:5px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px}
.pr-st{flex:1;min-width:56px;display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px solid #e3e7ef;background:#fafbfd;border-radius:10px;padding:6px 3px;font-size:14px;cursor:pointer;transition:all .13s;color:#5b6579}
.pr-st small{font-size:9.5px;font-weight:700}
.pr-st.on{transform:scale(1.04);box-shadow:0 3px 10px rgba(22,35,63,.18)}
.pr-actions{display:flex;gap:7px;align-items:center}
.pr-act{border:1.5px solid #e3e7ef;background:#fff;border-radius:10px;padding:8px 11px;font-size:12.5px;font-weight:700;color:#3c4759;cursor:pointer}
.pr-act.main{flex:1;background:#16233f;color:#fff;border-color:#16233f}
.pr-act.danger{color:#c0392b}
.pr-date{border:1.5px solid #e3e7ef;border-radius:10px;padding:7px 8px;font-size:12px;color:#3c4759;background:#fff;font-family:inherit}
.pr-msgs{margin-top:11px;border-top:1px dashed #e3e7ef;padding-top:11px;display:flex;flex-direction:column;gap:10px}
.pr-msg{background:#f7f8fb;border:1px solid #eceef4;border-radius:11px;padding:11px 13px}
.pr-msg-t{font-size:12px;font-weight:800;color:#185FA5;margin-bottom:5px}
.pr-msg-b{font-size:13px;color:#3c4759;line-height:1.55;white-space:pre-wrap}
.pr-copy{margin-top:8px;border:none;background:#185FA5;color:#fff;font-size:12px;font-weight:700;padding:7px 12px;border-radius:9px;cursor:pointer}
.pr-empty{text-align:center;color:#8C95A8;font-size:14px;padding:44px 20px;background:#fff;border:1.5px dashed #dde1e8;border-radius:14px;line-height:1.7}

/* Guide des cours */
.cg{padding-bottom:10px}
.cg-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(20,40,80,.04)}
.cg-head{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.cg-nm{font-size:17px;font-weight:800;color:var(--cp-dark)}
.cg-fam{font-size:11px;font-weight:600;color:var(--ink-mid)}
.cg-dispo{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:800;color:#1F9E75;background:#e7f6ef;border-radius:999px;padding:2px 8px;white-space:nowrap}
.cg-dispo.next{color:#8a5c0a;background:#fdf3e3}
.cg-quoi{font-size:13.5px;line-height:1.55;color:var(--ink-soft);margin-bottom:12px}
.cg-sec{margin-bottom:11px}
.cg-lab{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--cp-deep);margin-bottom:3px}
.cg-txt{font-size:12.5px;line-height:1.45;color:var(--ink)}
.cg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:11px}
@media(max-width:430px){.cg-grid{grid-template-columns:1fr}}
.cg-box{border-radius:12px;padding:10px 12px}
.cg-box.body{background:#EAF4EF}
.cg-box.mind{background:#EDF0FA}
.cg-bh{font-size:11.5px;font-weight:800;margin-bottom:6px;color:var(--cp-dark)}
.cg-box ul{list-style:none;margin:0;padding:0}
.cg-box li{position:relative;padding:2px 0 2px 15px;font-size:12px;line-height:1.4;color:var(--ink)}
.cg-box li::before{content:'•';position:absolute;left:2px;font-weight:800}
.cg-box.body li::before{color:var(--ok)}
.cg-box.mind li::before{color:var(--cp-deep)}
.cg-foot{border-top:1px dashed var(--line);padding-top:9px;display:flex;flex-direction:column;gap:5px}
.cg-pre,.cg-restr{font-size:11.5px;line-height:1.45;color:var(--ink-soft)}
.cg-pre b,.cg-restr b{color:var(--cp-dark);font-weight:700}
.cg-note{background:#FBEFD8;border-radius:12px;padding:11px 13px;font-size:12px;line-height:1.5;color:var(--warn);font-weight:600;margin-top:4px}
.pack-switch{display:flex;gap:7px;margin-top:6px}
.pack-switch button{flex:1;padding:9px 6px;border:1.5px solid var(--line);border-radius:11px;font-size:11.5px;font-weight:700;color:var(--ink-soft);background:#fff;line-height:1.2}
.pack-switch button.cur{background:var(--cp-pale);border-color:var(--cp-blue);color:var(--cp-deep)}
.pack-switch small{display:block;font-size:9.5px;color:var(--ink-mid);font-weight:600;margin-top:1px}

/* reframe value cards */
.rf{display:flex;align-items:flex-start;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:9px}
.rf .ic{width:40px;height:40px;border-radius:11px;background:var(--cp-pale);display:grid;place-items:center;font-size:19px;flex:0 0 auto}
.rf .big{font-weight:900;color:var(--cp-deep);font-size:18px;letter-spacing:-.01em;line-height:1.1}
.rf .lab{font-size:12.5px;color:var(--ink-soft);line-height:1.4;margin-top:2px}
.rf .lab b{color:var(--cp-deep)}
.rf-say{margin-top:8px;background:var(--cp-veil);border-left:3px solid var(--cp-blue);border-radius:8px;padding:8px 11px;font-size:13px;line-height:1.5;color:var(--cp-dark);font-weight:600}
.rf-anchor{background:#FBEFD8;border-radius:11px;padding:10px 13px;font-size:12px;line-height:1.45;color:var(--warn);font-weight:600;margin-bottom:12px}
.rf-anchor b{color:#7a4400}
.rf-proof{margin-top:14px;background:var(--cp-veil);border-radius:14px;padding:13px 14px}
.rf-proof-h{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--cp-deep);margin-bottom:9px}
.rf-chip{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:11.5px;font-weight:600;color:var(--cp-dark);margin:0 6px 6px 0;line-height:1.3}

.flex-note{display:flex;align-items:flex-start;gap:10px;background:var(--cp-pale);border-radius:13px;padding:12px 14px;margin-top:10px;font-size:12.5px;line-height:1.45;color:var(--cp-deep)}
.flex-note .fic{font-size:17px;flex:0 0 auto}
.flex-note b{font-weight:800}
/* Comparatif rythme 1x / 2x / illimité */
.rythme{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.rythme-h{font-size:12.5px;font-weight:800;color:var(--cp-deep);margin-bottom:10px;line-height:1.3}
.rythme-age{display:inline-block;background:var(--cp-pale);color:var(--cp-deep);font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;margin-left:4px;white-space:nowrap}
.rythme-row{border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px;transition:all .15s}
.rythme-row.cur{border-color:var(--cp-blue);background:var(--cp-veil);box-shadow:0 2px 10px rgba(111,140,184,.18)}
.rr-freq{font-size:14px;font-weight:800;color:var(--cp-dark)}
.rythme-row.cur .rr-freq{color:var(--cp-deep)}
.rr-time{font-size:13px;font-weight:700;color:var(--cp-blue);margin:2px 0 4px}
.rr-time small{font-weight:600;color:var(--ink-mid);font-size:10.5px;margin-left:5px}
.rr-lab{font-size:12px;line-height:1.4;color:var(--ink-soft)}
.rythme-foot{font-size:10.5px;color:var(--ink-mid);text-align:center;margin-top:4px;font-style:italic}
.pres-h{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--cp-deep);margin:18px 0 10px}
.pres-line{font-size:13.5px;line-height:1.55;color:var(--ink-soft);padding:7px 0;border-top:1px dashed var(--line)}
.pres-line:first-child{border-top:0;padding-top:0}
.pres-line b{color:var(--cp-dark);font-weight:700}
/* Les 3 fondamentaux */
.pres-h{scroll-margin-top:10px}
.pb-part{scroll-margin-top:10px}
.pres-toc{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 6px}
.pres-toc button{padding:6px 11px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:11.5px;font-weight:700;color:var(--ink-soft);cursor:pointer}
.pres-toc button.hot{background:var(--cp-dark);border-color:var(--cp-dark);color:#fff}
.fd-intro{font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin:-4px 0 12px}
.fd{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px 15px;margin-bottom:12px}
.fd-top{display:flex;align-items:center;gap:10px}
.fd-n{width:30px;height:30px;border-radius:10px;background:var(--cp-dark);color:#fff;font-weight:900;font-size:14px;display:grid;place-items:center;flex:0 0 auto}
.fd-t{font-weight:800;color:var(--cp-dark);font-size:15.5px;line-height:1.25}
.fd-ask{margin-top:9px;font-size:12.5px;color:var(--ink-soft);line-height:1.45;font-style:italic}
.fd-ask>b:first-child{font-style:normal;color:var(--cp-deep);font-weight:800;margin-right:3px}
.fd-say{margin-top:10px;background:var(--cp-veil);border-left:4px solid var(--ok);border-radius:0 12px 12px 0;padding:11px 13px;font-size:14.5px;line-height:1.55;color:var(--ink);font-weight:600}
.fd-say b{color:var(--cp-deep);font-weight:800}
.fd-say-h{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ok);margin-bottom:5px}
.fd .cls-warn{margin-top:9px}
.fd-hl{margin-top:9px;background:var(--cp-dark);color:rgba(255,255,255,.9);border-radius:12px;padding:10px 13px;font-size:13px;line-height:1.5}
.fd-hl b{color:#fff}
.fd-hl-h{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#9ec5a8;margin-bottom:4px}
.fd-more{margin-top:11px;border-top:1px dashed var(--line);padding-top:9px}
.fd-more summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--cp-deep)}
.fd-more summary::-webkit-details-marker{display:none}
.fd-more summary::after{content:'▾ déplier';margin-left:auto;font-size:11px;white-space:nowrap}
.fd-more[open] summary::after{content:'▴ replier'}
.fd-sub{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--cp-deep);margin:14px 0 0}
.fd-subd{font-size:12px;color:var(--ink-mid);font-style:italic;margin:8px 0 0}
.fd-more .cls .n{font-size:12px}
.fd-note{margin-top:10px;font-size:12px;line-height:1.5;color:var(--ink-soft);background:var(--cp-pale);border-radius:10px;padding:9px 12px}
.testi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:9px;border-left:3px solid var(--cp-blue)}
.testi-q{font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.45;color:var(--cp-dark)}
.testi-a{font-size:11px;color:var(--ink-mid);margin-top:6px;font-weight:600}
.testi-note{background:var(--cp-pale);border-radius:10px;padding:9px 12px;font-size:11px;line-height:1.45;color:var(--cp-deep);margin-top:4px}
.press{background:var(--cp-dark);color:#fff;border-radius:14px;padding:14px 16px;margin-bottom:9px;text-align:center}
.press-src{font-size:13px;font-weight:900;letter-spacing:.22em;text-transform:uppercase;opacity:.85}
.press-q{font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.35;margin:7px 0 6px}
.press-note{font-size:11px;color:rgba(255,255,255,.65);line-height:1.4}
/* La science */
.sci-tl{padding:9px 0;border-top:1px dashed var(--line)}
.sci-tl:first-child{border-top:0;padding-top:0}
.sci-tl-t{font-size:12.5px;font-weight:800;color:var(--cp-deep)}
.sci-tl-f{font-size:12.5px;line-height:1.45;color:var(--ink-soft);margin-top:2px}
.sci-src{font-size:11.5px;line-height:1.6;color:var(--ink-soft)}
.sci-diff{background:var(--cp-dark);color:#fff;border-radius:16px;padding:16px;margin-bottom:14px}
.sci-diff-h{font-size:15px;font-weight:800;margin-bottom:7px;line-height:1.3}
.sci-diff-d{font-size:13px;line-height:1.55;color:rgba(255,255,255,.82)}
.sci-diff .biens{margin-top:9px}
.sci-diff .biens li{color:#fff;font-weight:600}
.sci-diff .biens li::before{color:#9ec5a8}
/* card générique */
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px}

/* recap final */
.recap{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;color:var(--ink);max-height:38vh;overflow-y:auto}

/* nav bas */
.nav{flex:0 0 auto;display:flex;gap:10px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.nav .back{flex:0 0 auto;width:58px;border-radius:14px;background:var(--cp-veil);color:var(--ink-soft);font-size:22px;font-weight:700;display:grid;place-items:center}
.nav .back:active{background:var(--cp-pale)}
.nav .go{flex:1;border-radius:14px;background:var(--cp-deep);color:#fff;font-weight:800;font-size:16px;letter-spacing:.01em;display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px}
.nav .go:active{background:var(--cp-dark)}
.nav .go.ok{background:var(--ok)}

/* bouton objections flottant */
.fab{position:absolute;right:14px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:30;background:var(--cp-dark);color:#fff;border-radius:50%;width:56px;height:56px;display:grid;place-items:center;box-shadow:0 10px 26px -8px rgba(42,62,95,.6)}
.fab:active{transform:scale(.94)}
.fab .lbl{position:absolute;right:64px;background:var(--cp-dark);color:#fff;font-size:12px;font-weight:700;padding:6px 11px;border-radius:9px;white-space:nowrap;opacity:0;pointer-events:none}

/* sheets (objections / menu) */
.sheet-bg{position:fixed;inset:0;background:rgba(42,49,66,.5);z-index:50;opacity:0;pointer-events:none;transition:.22s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--cp-veil);border-radius:22px 22px 0 0;max-height:90vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(.3,.85,.3,1);max-width:560px;margin:0 auto}
.sheet.on{transform:translateY(0)}
.sheet-h{flex:0 0 auto;padding:16px 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-h .t{font-size:17px;font-weight:900;color:var(--cp-dark)}
.sheet-x{width:36px;height:36px;border-radius:11px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:19px;color:var(--ink-soft);flex:0 0 auto}
.sheet-body{flex:1 1 auto;overflow-y:auto;padding:0 18px calc(18px + env(safe-area-inset-bottom))}
.search{width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:13px;font:inherit;font-size:15px;margin-bottom:12px;background:#fff}
.search:focus{outline:0;border-color:var(--cp-blue)}
.obj{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.obj-h{display:flex;align-items:center;gap:10px;padding:13px 15px;font-weight:800;color:var(--cp-dark);font-size:14.5px;cursor:pointer}
.obj-h .ic{width:30px;height:30px;border-radius:9px;background:var(--cp-pale);display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.obj-h .ch{margin-left:auto;color:var(--ink-mid);transition:.2s}
.obj.open .obj-h .ch{transform:rotate(180deg)}
.obj-b{display:none;padding:0 15px 14px}
.obj.open .obj-b{display:block}
.obj-b .ln{padding:9px 0;border-top:1px dashed var(--line);font-size:13.5px;line-height:1.55;color:var(--ink-soft)}
.obj-b .ln:first-child{border-top:0}
.obj-b b{color:var(--cp-deep);font-weight:700}
.menu-item{display:flex;align-items:center;gap:13px;width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:9px;font-size:15.5px;font-weight:700;color:var(--ink);text-align:left}
.menu-item:active{background:var(--cp-pale)}
.menu-item .mic{width:34px;height:34px;border-radius:10px;background:var(--cp-pale);display:grid;place-items:center;font-size:17px;flex:0 0 auto}
.menu-item small{display:block;font-size:11.5px;font-weight:600;color:var(--ink-mid);margin-top:1px}

/* académie */
.aca{padding:4px 0}
.aca-h{background:linear-gradient(135deg,var(--cp-dark),#1c2c47);color:#fff;border-radius:16px;padding:20px;margin-bottom:12px}
.aca-h h2{font-size:20px;font-weight:900;margin-bottom:6px}
.aca-h p{font-size:13px;color:rgba(255,255,255,.85);line-height:1.5}
.aca-l{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:10px}
.aca-l .nb{display:inline-block;background:var(--cp-pale);color:var(--cp-deep);font-size:10px;font-weight:800;letter-spacing:.05em;padding:3px 9px;border-radius:6px;margin-bottom:7px}
.aca-l h3{font-size:15.5px;font-weight:900;color:var(--cp-dark);margin-bottom:5px}
.aca-l .ld{font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin-bottom:8px}
.aca-row{display:flex;gap:8px;font-size:13px;color:var(--ink-soft);line-height:1.45;padding:6px 0}
.aca-row .ck{color:var(--ok);font-weight:900;flex:0 0 auto}
.lvls{display:grid;gap:8px}
.lvl{border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.lvl .bg{display:inline-block;font-size:10.5px;font-weight:800;color:#fff;padding:3px 9px;border-radius:7px;letter-spacing:.03em}
.lvl .lt{font-size:14.5px;font-weight:900;color:var(--cp-dark);margin:5px 0 3px}
.lvl .ld{font-size:12px;color:var(--ink-soft);line-height:1.45}
.strat{background:linear-gradient(135deg,#fef3c7,#fdebcd);border:1px solid #f0d090;border-radius:13px;padding:14px}
.strat .pq{font-family:var(--serif);font-style:italic;font-size:14px;color:#5a4419;line-height:1.5;margin:6px 0 8px}
.strat ul{list-style:none}
.strat li{font-size:12px;color:#7a4400;padding:2px 0 2px 16px;position:relative}
.strat li::before{content:'⚡';position:absolute;left:-2px;font-size:11px}

/* settings modal */
.modal-bg{position:fixed;inset:0;background:rgba(42,49,66,.55);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:20px 14px;overflow-y:auto}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:18px;max-width:480px;width:100%;padding:20px;margin:auto}
.modal h3{font-size:18px;font-weight:900;color:var(--cp-dark);margin-bottom:14px}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px}
.fld input{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;font:inherit;font-size:15px}
.fld input:focus{outline:0;border-color:var(--cp-blue)}
.fld .hint{font-size:11px;color:var(--ink-mid);margin-top:4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal .nav2{display:flex;gap:10px;margin-top:8px}
.modal .nav2 button{flex:1;padding:13px;border-radius:12px;font-weight:800}
.modal .nav2 .cx{background:var(--cp-veil);color:var(--ink-soft)}
.modal .nav2 .sv{background:var(--cp-deep);color:#fff}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--cp-dark);color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:700;z-index:80;opacity:0;pointer-events:none;transition:.3s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.divider{height:1px;background:var(--line);margin:14px 0}

/* ── Habillage latéral grands écrans : les 6 principes de la méthode,
   liseré or et colonne de points (écho du cercle pointillé du logo) ── */
@media(min-width:1140px){
  #app{position:relative;z-index:1}
  body::before,body::after{
    position:fixed;top:50%;transform:translateY(-50%);z-index:0;pointer-events:none;
    writing-mode:vertical-rl;text-orientation:mixed;white-space:nowrap;
    font-family:var(--sans);font-weight:800;font-size:10.5px;
    letter-spacing:.45em;text-transform:uppercase;color:rgba(42,62,95,.15);
    padding:44px 26px;
    background-repeat:no-repeat,repeat-y;
  }
  body::before{
    content:'Concentration · Contrôle · Centrage';
    left:max(14px,calc(50% - 300px - 118px));
    background-image:linear-gradient(180deg,transparent,rgba(201,135,31,.45) 18% 82%,transparent),radial-gradient(circle,rgba(111,140,184,.32) 1.2px,transparent 1.7px);
    background-position:right center,calc(100% - 10px) top;
    background-size:1px 100%,4px 17px;
  }
  body::after{
    content:'Respiration · Précision · Fluidité';
    right:max(14px,calc(50% - 300px - 118px));
    background-image:linear-gradient(180deg,transparent,rgba(201,135,31,.45) 18% 82%,transparent),radial-gradient(circle,rgba(111,140,184,.32) 1.2px,transparent 1.7px);
    background-position:left center,10px top;
    background-size:1px 100%,4px 17px;
  }
}

/* ═══════════════ DESIGN 2.1 · passe « agence » ═══════════════
   Surfaces plus riches, script recentré sur la lisibilité,
   accent doré discret, ombres en couches, micro-interactions. */
:root{
  --gold:#C9871F; --gold-soft:#E6B45C;
  --sh-s:0 1px 2px rgba(26,36,58,.06),0 4px 14px -4px rgba(26,36,58,.08);
  --sh-m:0 2px 4px rgba(26,36,58,.05),0 14px 34px -12px rgba(26,36,58,.18);
  --r:16px;
}
body{background:
  radial-gradient(1200px 500px at 85% -10%, #eef3fa 0%, transparent 60%),
  radial-gradient(900px 420px at -10% 108%, #f6f2ea 0%, transparent 55%),
  var(--cp-veil)}
#app{max-width:600px}
@media(min-width:640px){
  #app{box-shadow:0 0 0 1px rgba(42,62,95,.06),0 30px 80px -30px rgba(42,62,95,.28);border-radius:0}
}

/* Topbar : navy profond + liseré or */
.top{background:linear-gradient(180deg,#26385A 0%,#1E2E4C 100%)}
.top-in{padding:13px 18px}
.top-logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold-soft));font-size:13px;box-shadow:0 4px 12px -3px rgba(201,135,31,.5)}
.top-phase{font-size:13.5px;letter-spacing:.01em}
.top-sub{color:rgba(255,255,255,.45)}
.bar{height:3px;background:rgba(255,255,255,.1)}
.bar-fill{background:linear-gradient(90deg,var(--gold),var(--gold-soft))}

/* Écran */
.screen{padding:26px 20px 28px}
.scr-tag{padding:6px 12px;border-radius:999px;font-size:10.5px;letter-spacing:.09em;margin-bottom:18px;box-shadow:var(--sh-s)}
.scr-tag::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7}
.scr-q{font-size:26px;line-height:1.18;letter-spacing:-.022em;margin-bottom:8px}
.scr-sub{font-size:14px;margin-bottom:20px}

/* Options : cartes plus nettes, survol desktop */
.opt{border:1.5px solid #E3E9F2;border-radius:var(--r);box-shadow:var(--sh-s);transition:transform .16s,box-shadow .16s,border-color .16s,background .16s}
@media(hover:hover){.opt:hover{transform:translateY(-1px);box-shadow:var(--sh-m);border-color:var(--cp-soft)}}
.opt.sel{background:linear-gradient(135deg,var(--cp-deep),var(--cp-dark));border-color:transparent;box-shadow:0 10px 26px -8px rgba(42,62,95,.5)}

/* ── LE SCRIPT : carte de lecture, plus texte-affiche ── */
.say-card{justify-content:flex-start;padding-top:2px}
.say-big{background:#fff;border:1px solid #EBEFF6;border-radius:20px;padding:26px 24px 24px;box-shadow:var(--sh-m);font-size:clamp(17.5px,4.1vw,21px);font-weight:500;line-height:1.62;color:#333B4E;letter-spacing:0}
.say-big.quote{padding-left:24px;position:relative;overflow:hidden}
.say-big.quote::before{content:'“';position:absolute;top:-14px;right:10px;font-family:var(--serif);font-size:120px;line-height:1;color:var(--cp-pale);z-index:0;pointer-events:none}
.say-big.quote::after{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--gold),var(--gold-soft));border-radius:0 3px 3px 0}
.say-big b{position:relative;z-index:1;color:var(--cp-dark);font-weight:700;background:linear-gradient(180deg,transparent 62%,rgba(201,135,31,.22) 62%)}
.say-hint{margin-top:16px;font-size:13px;background:#fff;border:1px dashed #DDE4EF;border-radius:13px;padding:11px 14px;font-style:normal;color:var(--ink-soft)}
.idea-pill{background:#fff;border:1px solid #EFE3C8;border-left:4px solid var(--gold);border-radius:12px;box-shadow:var(--sh-s)}
.sp-toggle{background:#E9EDF4;border-radius:11px;padding:3px;box-shadow:inset 0 1px 3px rgba(26,36,58,.08)}
.sp-toggle button{padding:6px 15px;border-radius:9px}
.sp-toggle button.on{background:var(--cp-dark);color:#fff;box-shadow:0 2px 8px -2px rgba(42,62,95,.5)}

/* Cartes génériques */
.card{border:1px solid #EBEFF6;border-radius:18px;box-shadow:var(--sh-s)}
.reco-card{border-radius:22px;box-shadow:0 18px 44px -16px rgba(42,62,95,.45)}
.reco-card::after{content:'';position:absolute;inset:0;background:radial-gradient(420px 200px at 90% -20%,rgba(255,255,255,.14),transparent 60%);pointer-events:none}
.reco-badge{background:rgba(201,135,31,.9)}

/* Nav bas : verre + CTA dégradé */
.nav{background:rgba(255,255,255,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(42,62,95,.08);padding:13px 18px calc(15px + env(safe-area-inset-bottom))}
.nav .go{border-radius:15px;background:linear-gradient(135deg,var(--cp-deep) 0%,var(--cp-dark) 100%);box-shadow:0 10px 24px -8px rgba(42,62,95,.55);transition:transform .14s,box-shadow .14s}
.nav .go:active{transform:scale(.98)}
@media(hover:hover){.nav .go:hover{transform:translateY(-1px);box-shadow:0 14px 30px -10px rgba(42,62,95,.6)}}
.nav .go.ok{background:linear-gradient(135deg,#22A87D,#157A59)}
.nav .back{border-radius:15px;background:#EEF1F7;transition:background .14s}

/* Fab + menu + toast */
.fab{background:linear-gradient(135deg,#26385A,#1E2E4C);border:1.5px solid rgba(255,255,255,.14);box-shadow:0 12px 30px -8px rgba(30,46,76,.65)}
.menu-item{border:1px solid #EBEFF6;border-radius:15px;box-shadow:var(--sh-s);transition:transform .14s,box-shadow .14s}
@media(hover:hover){.menu-item:hover{transform:translateY(-1px);box-shadow:var(--sh-m)}}
.menu-item .mic{background:linear-gradient(135deg,var(--cp-pale),#DCE6F2);border-radius:11px}
.toast{background:rgba(30,46,76,.94);backdrop-filter:blur(8px);border-radius:999px;padding:11px 20px;box-shadow:0 12px 32px -8px rgba(30,46,76,.5)}

/* Champs : focus ring homogène */
input[type=text],input[type=tel],input[type=date],input[type=number],textarea,select{transition:border-color .14s,box-shadow .14s}
input:focus,textarea:focus,select:focus{border-color:var(--cp-deep)!important;box-shadow:0 0 0 3px rgba(79,111,160,.16)}


/* ── Passe moderne 2026 ── */
:root{--sh-s:0 1px 2px rgba(26,36,58,.05),0 4px 14px -4px rgba(42,62,95,.10);--sh-m:0 2px 4px rgba(26,36,58,.05),0 14px 34px -12px rgba(42,62,95,.22);--r:17px}
body{background:
  radial-gradient(1100px 500px at 112% -8%, #E4EBF5 0%, transparent 58%),
  radial-gradient(900px 420px at -10% 108%, #F4EFE6 0%, transparent 55%),
  var(--cp-veil)}
.top{background:linear-gradient(180deg,#223354 0%,#1B2A47 100%);position:relative}

/* ════════════════════════════════════════════════════════════════

const DEFAULT_CFG={studio:'',rep:'',base:45,p1:142,p2:252,p3:352,founding:20,privateSession:95,spotsLeft:50};
const SESSIONS_PER_MONTH={1:4,2:8,3:null};
let CFG=Object.assign({},DEFAULT_CFG,JSON.parse(localStorage.getItem('cpcoach_cfg')||'{}'));

// Pack idéal selon le profil (indépendant du choix manuel du commercial)
function idealPack(){
  const g=st.goals,pain=st.pain;let score=2;
  if(st.dispo==='high')score=3;
  if(g.includes('perf')&&st.dispo!=='low')score=3;
  if(st.dispo==='low'){score=(pain.includes('temps')&&(st.pain.includes('jamais')||!st.tried.length))?1:2;if(pain.includes('resultats'))score=2;}
  return score;
}
function recommendPack(){return st.packChoice||idealPack();}
function recommendClasses(pack){
  const g=st.goals,health=activeHealth(),pain=st.pain;
  const blocked=id=>CLASSES[id].restr.some(r=>r==='blessure_prolongee'?(health.includes('genou')||health.includes('chirurgie')):health.includes(r));
  const out=[];
  const veryBeginner=pain.includes('jamais')||st.ageBand==='55-70'||health.includes('senior');
  if(veryBeginner)out.push({id:'foundation05'});
  out.push({id:'flow1'});
  let second=null;
  if(g.includes('poids')){if(!blocked('cs1'))second='cs1';else if(!blocked('cb'))second='cb';}
  if(!second&&(g.includes('mobilite')||g.includes('posture')))second='cb';
  if(!second&&(g.includes('douleur')||g.includes('stress')))second='cb'; // Restore n'est pas à notre planning (oct. 2026)
  if(!second&&g.includes('tonus'))second=!blocked('cs1')?'cs1':'cb';
  if(!second)second=!blocked('cs1')?'cs1':'cb';
  out.push({id:second});
  if(pack===3){const used=out.map(o=>o.id);const c=['cb','cs1'].filter(x=>!used.includes(x)&&!blocked(x));if(c.length)out.push({id:c[0]});}
  return out;
}
function classWarnings(recos){
  const health=activeHealth(),w=[];
  recos.forEach(r=>{const hit=CLASSES[r.id].restr.filter(x=>x==='blessure_prolongee'?(health.includes('genou')||health.includes('chirurgie')):health.includes(x));if(hit.length)w.push(`${CLASSES[r.id].nm} : prudence · ${hit.map(h=>lbl(HEALTH,h)||h).join(', ')}. Valider avec le coach.`);});
  return w;
}
function matchScore(pack){
  pack=pack||recommendPack();
  // 1) Confiance : plus la découverte est riche, plus on est sûr.
  let s=46;
  s+=Math.min(st.goals.length,3)*4;
  if(st.pain.length)s+=5;if(st.trigger)s+=5;if(st.emotion)s+=4;if(st.dispo)s+=5;if(st.tried.length)s+=3;if(st.goals.length>1)s+=3;
  // 2) Adéquation du pack choisi avec le profil.
  const ideal=idealPack();
  if(pack===ideal)s+=12; else s-=Math.abs(pack-ideal)*7;
  if(pack===3){ if(st.dispo==='high'||st.goals.includes('perf'))s+=6; if(st.dispo==='low')s-=10; }
  if(pack===1){ if(st.dispo==='low')s+=5; else s-=5; }
  if(pack===2&&st.dispo&&st.dispo!=='low')s+=3;
  return Math.max(35,Math.min(99,Math.round(s)));
}

function fmtEur(v){if(v==null||v==='')return null;const n=parseFloat(v);if(isNaN(n))return null;return n.toLocaleString('fr-FR',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})+' €';}

function navHTML(showBack,goLabel){
  const back=showBack?`<button class="back" onclick="prev()">‹</button>`:'';
  return back+`<button class="go" onclick="next()">${goLabel||'Continuer'} ${goLabel&&goLabel.includes('→')?'':'→'}</button>`;
}
