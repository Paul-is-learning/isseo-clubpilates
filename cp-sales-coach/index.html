// Nombre de cours / semaine retenu pour chiffrer l'Illimité (mémorisé sur l'appareil)
function _illiPerWeek(){let n=4;try{n=parseInt(localStorage.getItem('cpcoach_illi'),10)||4;}catch(e){}return Math.min(7,Math.max(1,n));}
function illiPerWeek(v){
  const n=Math.min(7,Math.max(1,parseInt(v,10)||0));if(!n)return;
  try{localStorage.setItem('cpcoach_illi',String(n));}catch(e){}
  const m3=parseFloat(CFG.p3),pct=parseFloat(CFG.founding)||0,per=n*4;
  // Mise à jour sur place : le champ garde le focus pendant la saisie
  document.querySelectorAll('.pb-illi-ps').forEach(e=>e.textContent=fmtEur(m3*(1-pct/100)/per));
  document.querySelectorAll('.pb-illi-was').forEach(e=>e.textContent='au lieu de '+fmtEur(m3/per));
  document.querySelectorAll('.pb-illi-n').forEach(e=>{if(e!==document.activeElement)e.value=n;});
}
function priceBoxHTML(){
  const f=v=>fmtEur(v)||'—',m1=parseFloat(CFG.p1),m2=parseFloat(CFG.p2),m3=parseFloat(CFG.p3);
  const pct=parseFloat(CFG.founding)||0,d=v=>v*(1-pct/100);
  let cp=0;try{cp=(st.goals&&st.goals.length)||st.dispo?recommendPack():0;}catch(e){}
  const wide=window.matchMedia('(min-width:1060px)').matches;
  let open=wide;try{const v=localStorage.getItem(wide?'cpcoach_pbox_d':'cpcoach_pbox');if(v!==null)open=v==='1';}catch(e){}
  const row=(p,name,freq,prix,promo,per,was)=>`<div class="pb-row${p===cp?' cur':''}">
      <div class="pb-n"><b>${name}</b><small>${freq}</small>${p===cp?'<span class="pb-reco">reco</span>':''}</div>
      <div class="pb-p">${prix}<small>${promo}</small></div>
      <div class="pb-s"><b>${per}</b><small>${was}</small></div>
    </div>`;
  return `<details class="price-box"${open?' open':''} ontoggle="try{localStorage.setItem(window.matchMedia('(min-width:1060px)').matches?'cpcoach_pbox_d':'cpcoach_pbox',this.open?'1':'0')}catch(e){}">
    <summary>💶 Tarifs & conditions <small>offre de lancement · TTC / mois</small></summary>
    <div class="pb-head"><span>Formule</span><span>Prix / mois</span><span>La séance</span></div>
    ${row(1,'Pack 4','4 séances',`<b>${f(m1)}</b>`,'🎁 +1 séance offerte / mois · 3 mois',f(m1/5),'au lieu de '+f(m1/4))}
    ${row(2,'Pack 8','8 séances',`<s>${f(m2)}</s> <b>${f(d(m2))}</b>`,'-'+pct+' % à vie',f(d(m2)/8),'au lieu de '+f(m2/8))}
    ${(()=>{const n=_illiPerWeek(),per=n*4;
      return row(3,'Illimité',`<span class="pb-illi">à <input type="number" class="pb-illi-n" min="1" max="7" step="1" value="${n}" oninput="illiPerWeek(this.value)" aria-label="Cours par semaine"/> cours / sem</span>`,`<s>${f(m3)}</s> <b>${f(d(m3))}</b>`,'-'+pct+' % à vie',
        `<span class="pb-illi-ps">${f(d(m3)/per)}</span>`,
        `<span class="pb-illi-was">au lieu de ${f(m3/per)}</span>`);})()}
    <ul class="pb-cond">
      <li><b>Inscription offerte</b> (valeur 149 €)</li>
      <li><b>-${pct} % à vie</b> réservé aux 50 premiers membres · <b>les places partent vite</b></li>
      <li>Engagement <b>3 mois</b>, tacitement renouvelable</li>
      <li><b>1er mois réglé à la réservation</b> · il couvre le 1er mois de cours ; 2e prélèvement au 2e mois de pratique</li>
      <li><b>Parrainage</b> : -25 € pour le parrain et -25 € pour le filleul, sur le prochain prélèvement · cumulable avec le fondateur · parrain déjà inscrit</li>
      <li>Hors forfait : séance à l'unité ${f(CFG.base)} · séance privée ${f(CFG.privateSession)} (Cadillac en privé)</li>
    </ul>
  </details>`;

  if(CFG.studio!==before)localStorage.setItem('cpcoach_cfg',JSON.stringify(CFG));

async function syncCall(action,extra){
  const r=await fetch(SYNC_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({code:COACH_CODE,action:action,device:DEVICE_ID},extra||{}))});
  const d=await r.json().catch(()=>({}));
  if(r.status===401){
    window._authErr=String(d.error||'');
    localStorage.removeItem('cpcoach_code');COACH_CODE='';showLock();

    setTimeout(()=>{const e=document.getElementById('lockErr');if(e)e.textContent=_lockMsg('code');},0);

}

// Purge administrative : si le serveur a été remis à zéro après notre dernière
// synchro, on vide le stock local au lieu de re-pousser d'anciennes fiches.
function _adoptEpoch(d){
  if(!d||!d.epoch)return false;
  const seen=+localStorage.getItem('cpcoach_epoch')||0;
  if(d.epoch>seen){
    localStorage.setItem('cpcoach_epoch',String(d.epoch));

}
function schedulePush(){clearTimeout(_pushT);_pushT=setTimeout(syncPush,700);}
async function syncPush(){
  if(!COACH_CODE)return;
  _syncState('sync');
  try{const d=await syncCall('push',{prospects:PROSPECTS});if(!_adoptEpoch(d)&&d&&d.prospects){PROSPECTS=d.prospects;persistProspects();}if(d&&'studio' in d&&_adoptStudio(d))_rerenderTop();_syncState('ok');_lastSync=new Date().toISOString();}
  catch(e){if(e.message!=='code')_syncState('off');}
}
async function syncPull(rerender){
  if(!COACH_CODE)return;
  _syncState('sync');
  try{
    const d=await syncCall('pull');
    const server=d.prospects||[];
    const tomb=new Set(d.tomb||[]);
    const studioChanged=('studio' in d)&&_adoptStudio(d);
    if(_adoptEpoch(d)){/* purge administrative : local vidé, rien à re-pousser */}
    else{
      // Les fiches locales absentes du serveur (créées hors-ligne) sont conservées puis poussées
      const ids=new Set(server.map(p=>p.id));
      const _k=s=>String(s||'').replace(/\D/g,'').slice(-9);
      const byTel=new Map();server.forEach(p=>{const k=_k(p.tel);if(k.length===9&&!byTel.has(k))byTel.set(k,p);});
      let absorbed=0;
      const localOnly=PROSPECTS.filter(p=>{
        if(ids.has(p.id)||tomb.has(p.id))return false; // supprimée dans Boost : jamais repoussée
        const t=byTel.get(_k(p.tel));
        if(!t||(_sk(t.studio)&&_sk(p.studio)&&_sk(t.studio)!==_sk(p.studio)))return true;
        // Même numéro qu'une fiche du serveur (ex. créée par Allo) : on fusionne la saisie locale dedans
        if((p.maj||'')>(t.maj||'')){
          if(p.nom&&(/^Contact 0/.test(t.nom||'')||!t.nom))t.nom=p.nom;
          ['fiche','statut','pack','v2','icId','rappel','rappelH','rappelBy','obj'].forEach(f=>{if(p[f])t[f]=p[f];});
          if(p.fullCom)t.fullCom=true;
          if(p.note&&String(t.note||'').indexOf(p.note)<0)t.note=[t.note,p.note].filter(Boolean).join(' · ').slice(0,300);
          if(!t.rep&&p.rep)t.rep=p.rep;
          t.maj=p.maj;
        }
        absorbed++;return false;
      });
      PROSPECTS=server.concat(localOnly);
      persistProspects();
      if(localOnly.length||absorbed)schedulePush();
    }
    _syncState('ok');_lastSync=new Date().toISOString();
    if(studioChanged)_rerenderTop();
    else if(rerender&&$('#topPhase').textContent==='Mes prospects')showProspects(true);
  }catch(e){if(e.message!=='code')_syncState('off');}
}

  powerhouse:{t:'Powerhouse',d:'Le « centre » du corps en Pilates : abdos, bas du dos, bassin et fessiers. Tout mouvement part de là.'}
};
const GL_ALTS=[
  ['métabolisme de base','metabolisme'],['essais? contrôlés? randomisés?','rct'],['méta-analyses?','metaanalyse'],
  ['masse grasse','massegrasse'],['plancher pelvien','plancher'],['multifides?','multifides'],
  ['transverses?','transverse'],['diaphragmes?','diaphragme'],['gainage','gainage'],['excentriques?','excentrique'],
  ['proprioceptions?','proprioception'],['sarcopénie','sarcopenie'],['cortisol','cortisol'],['IMC','imc'],
  ['lombalgies?','lombalgie'],['Cochrane','cochrane'],['Reformers?','reformer'],['centrage','centrage'],
  ['Contrology','contrology'],['contrôlogie','contrology'],['powerhouse','powerhouse']
];
const GL_RE=new RegExp('(?<![A-Za-zÀ-ÖØ-öø-ÿ-])('+GL_ALTS.map(a=>a[0]).join('|')+')(?![A-Za-zÀ-ÖØ-öø-ÿ-])','gi');
function _glKey(word){
  const w=word.toLowerCase();
  for(const [pat,key] of GL_ALTS){if(new RegExp('^(?:'+pat+')$','i').test(word))return key;}
  return null;
}
function glossify(root){
  if(!root)return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{
    const p=n.parentElement;
    if(!p||p.closest('.gl,script,style,textarea,input,select,.tm-code,#glossPop,.scr-tag,.pres-toc,summary,.qz-q,.qz-ch'))return NodeFilter.FILTER_REJECT;
    GL_RE.lastIndex=0;
    return GL_RE.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;
  }});
  const nodes=[];let n;while(n=walker.nextNode())nodes.push(n);
  nodes.forEach(node=>{
    const frag=document.createDocumentFragment();
    let last=0;const txt=node.nodeValue;GL_RE.lastIndex=0;
    txt.replace(GL_RE,(m,g,off)=>{
      const key=_glKey(m);
      frag.appendChild(document.createTextNode(txt.slice(last,off)));
      if(key){
        const s=document.createElement('span');s.className='gl';s.textContent=m;
        s.addEventListener('click',ev=>{ev.stopPropagation();ev.preventDefault();showGloss(key);});
        frag.appendChild(s);
      }else frag.appendChild(document.createTextNode(m));
      last=off+m.length;return m;
    });
    frag.appendChild(document.createTextNode(txt.slice(last)));
    node.parentNode.replaceChild(frag,node);
  });
}
function showGloss(key){
  const g=GLOSSARY[key];if(!g)return;
  document.getElementById('glossPop')?.remove();
  const d=document.createElement('div');d.id='glossPop';
  d.innerHTML=`<div class="glp-bg"></div><div class="glp-card">
    <div class="glp-tag">📖 Glossaire</div>
    <div class="glp-t">${g.t}</div>
    <div class="glp-d">${g.d}</div>
    <button class="glp-ok">Compris ✓</button>
  </div>`;
  d.querySelector('.glp-bg').onclick=()=>d.remove();
  d.querySelector('.glp-ok').onclick=()=>d.remove();
  document.body.appendChild(d);
}

function avatarFromFile(input){
  const f=input.files&&input.files[0];if(!f)return;
  const img=new Image();
  img.onload=()=>{
    const S=128,c=document.createElement('canvas');c.width=S;c.height=S;
    const x=c.getContext('2d');
    const r=Math.max(S/img.width,S/img.height),w=img.width*r,h=img.height*r;

    URL.revokeObjectURL(img.src);

  img.src=URL.createObjectURL(f);

/* ── Journal de performance : événements immuables (appel/essai/venu/abo/perdu)
   File locale résistante au hors-ligne, poussée vers _coach_stats.
   Les stats long terme survivent ainsi à la suppression des fiches. ── */
let EVQ=[];try{EVQ=JSON.parse(localStorage.getItem('cpcoach_evq')||'[]');}catch(e){EVQ=[];}
function _persistEvq(){try{localStorage.setItem('cpcoach_evq',JSON.stringify(EVQ));}catch(e){}}
function emitEvent(p,type,extra){
  if(!p||!p.id)return;
  const ev=Object.assign({k:p.id+':'+type,type:type,rep:(p.rep||CFG.rep||''),nom:p.nom||'',studio:(p.studio||CFG.studio||''),ts:new Date().toISOString()},extra||{});
  const i=EVQ.findIndex(e=>e.k===ev.k);if(i>=0)EVQ[i]=ev;else EVQ.push(ev);
  _persistEvq();scheduleEvFlush();
}
let _evT=null;
function scheduleEvFlush(){clearTimeout(_evT);_evT=setTimeout(flushEvents,900);}
async function flushEvents(){
  if(!COACH_CODE||!EVQ.length)return;
  const batch=EVQ.slice();
  try{
    await syncCall('stats_push',{events:batch});
    EVQ=EVQ.filter(e=>!batch.some(b=>b.k===e.k&&b.ts===e.ts));
    _persistEvq();
  }catch(e){/* hors-ligne : la file attend le prochain flush */}
}

async function addInvite(){
  const nom=($('#tm-nom')?.value||'').trim();
  const studio=($('#tm-studio')?.value||'').trim();
  if(!nom){toast('Entrez un prénom');$('#tm-nom')?.focus();return;}
  if(!studio){toast('Choisissez son studio d\'affectation');$('#tm-studio')?.focus();return;}
  try{
    const d=await syncCall('team_add',{nom:nom,studio:studio});
    renderTeam((window._TEAM||[]).concat([d.invite]));
    toast('Code créé pour '+nom+' : '+d.invite.code);
  }catch(e){if(e.message!=='code')toast('Erreur : '+e.message);}
}

function perfLevel(abos){let cur=PERF_LEVELS[0];for(const l of PERF_LEVELS)if(abos>=l.min)cur=l;const i=PERF_LEVELS.indexOf(cur);return{cur:cur,next:PERF_LEVELS[i+1]||null};}

function buildStatsMap(events,prospects){
  const map={};
  const touch=id=>map[id]||(map[id]={rep:'',nom:'',appel:false,essai:false,venu:false,abo:false,perdu:false,pack:'',prime:0,ts:'',aboTs:''});
  (prospects||[]).forEach(p=>{
    // Fiche venue de Boost sans appel dans l'outil, ou statut posé par Boost : ne compte pas dans la Perf
    if(p.bset||(p.bid&&!(p.appels||[]).length))return;
    const m=touch(p.id);m.rep=m.rep||p.rep||'';m.nom=m.nom||p.nom||'';m.appel=true;m.ts=m.ts||p.ts||'';
    if(p.statut==='essai')m.essai=true;
    if(p.statut==='venu'){m.essai=true;m.venu=true;}
    if(p.statut==='abo'){m.abo=true;if(p.pack)m.pack=p.pack;m.aboTs=m.aboTs||p.maj||p.ts||'';m.v2=m.v2||p.v2||'';if(p.fullCom)m.fullCom=true;m.icId=m.icId||p.icId||'';}
    if(p.statut==='perdu')m.perdu=true;
  });
  (events||[]).forEach(e=>{
    const m=touch(String(e.k).split(':')[0]);
    if(e.rep)m.rep=e.rep;if(e.nom)m.nom=e.nom;
    if(e.type==='appel'){m.appel=true;if(!m.ts||e.ts<m.ts)m.ts=e.ts;if(+e.dur)m.dur=+e.dur;}
    if(e.type==='essai')m.essai=true;
    if(e.type==='venu'){m.essai=true;m.venu=true;}
    if(e.type==='abo'){m.abo=true;m.appel=true;if(e.pack)m.pack=String(e.pack);if(+e.prime)m.prime=+e.prime;m.aboTs=e.ts;m.v2=e.v2||m.v2||'';m.fullCom=e.fullCom===true;m.icId=e.icId||m.icId||'';}
    if(e.type==='perdu')m.perdu=true;
  });
  Object.values(map).forEach(m=>{if(m.abo&&!m.prime&&m.pack)m.prime=+PRIMES[+m.pack]||0;});
  return map;
}
function saleShare(m,repName){
  const k=_repKey(repName),k1=_repKey(m.rep),k2=_repKey(m.v2||'');
  if(!m.v2)return k===k1?1:0;
  if(m.fullCom)return k===k2?1:0;
  return (k===k1||k===k2)?0.5:0;
}
function aggStats(map,repName){
  const rows=Object.values(map).filter(m=>!repName||_repKey(m.rep)===_repKey(repName)||_repKey(m.v2||'')===_repKey(repName));
  const month=new Date().toISOString().slice(0,7);
  const a={appels:0,essais:0,venus:0,abos:0,perdus:0,primeTotal:0,primeMois:0,abosMois:0,maxAbosMois:0,maxAbosJour:0,durSum:0,durN:0,packs:{1:0,2:0,3:0},packsMois:{1:0,2:0,3:0}};
  const perMonth={},perDay={};
  rows.forEach(m=>{
    if(m.appel)a.appels++;if(m.essai)a.essais++;if(m.venu)a.venus++;if(m.perdu)a.perdus++;
    if(m.dur){a.durSum+=m.dur;a.durN++;}
    if(m.abo){const sh=repName?saleShare(m,repName):1;
      a.abos++;a.primeTotal+=m.prime*sh;if(+m.pack)a.packs[+m.pack]++;
      const mk=(m.aboTs||'').slice(0,7);if(mk){perMonth[mk]=(perMonth[mk]||0)+1;}
      const dk=(m.aboTs||'').slice(0,10);if(dk){perDay[dk]=(perDay[dk]||0)+1;}
      if((m.aboTs||'').startsWith(month)){a.abosMois++;a.primeMois+=m.prime*sh;if(+m.pack)a.packsMois[+m.pack]++;}}
  });
  a.maxAbosMois=Math.max(0,...Object.values(perMonth));
  a.maxAbosJour=Math.max(0,...Object.values(perDay));
  return a;
}

  {id:'k2',ic:'🛟',t:'La méthode & le Reformer',sub:'D\'où vient la méthode, pourquoi le Reformer, et comment il s\'adapte à chacun, du grand débutant au sportif',lesson:[{h:'📜 Joseph Pilates et la Contrology',pts:['La méthode a été créée il y a un siècle par <b>Joseph Pilates</b>, qui l\'appelait <b>Contrology</b> (contrôlogie) : l\'esprit contrôle le muscle, pas l\'inverse. Jamais « centrologie » : le centrage (centering) est l\'un de ses principes, d\'où la confusion.','Son parcours : enfant chétif (asthme, rachitisme) devenu boxeur, puis <b>interné civil</b> dans un camp en Angleterre pendant la Première Guerre, où il a fait pratiquer sa méthode aux autres internés, jusqu\'aux malades alités. Il n\'a <b>pas</b> soigné de soldats.','Il l\'a ensuite enseignée aux danseurs de New York : trois publics très différents, la même méthode. Ça répond à « est-ce que c\'est pour moi ? » : oui, quel que soit le point de départ. Et le siècle d\'histoire répond à « c\'est une mode ? ».','C\'est lui qui a inventé le Reformer. <b>Selon son histoire</b>, ses premiers appareils sont nés pour la rééducation, avec des ressorts fixés sur des lits d\'hôpital : on garde toujours ce « selon son histoire », on ne le présente jamais comme un fait prouvé.'],say:'« Le Pilates n\'est pas une mode : Joseph Pilates a créé sa méthode il y a un siècle, il l\'appelait Contrology, l\'idée que c\'est l\'esprit qui contrôle le muscle. »'},{h:'🎯 Les 6 principes de la méthode',pts:['<b>Concentration</b> (chaque mouvement en pleine attention), <b>Contrôle</b> (rien n\'est subi : le retour du chariot compte autant que l\'aller), <b>Centrage</b> (tout part du powerhouse : abdominaux profonds, bas du dos, bassin, fessiers).','<b>Précision</b> (mieux vaut 5 répétitions justes que 20 approximatives), <b>Respiration</b> (coordonnée au mouvement, jamais bloquée), <b>Fluidité</b> (les mouvements s\'enchaînent, sans à-coups).','Ces principes servent à répondre à « c\'est de la gym douce ? » : c\'est un travail de contrôle et de précision, mouvement par mouvement.'],say:'« Chez nous, aucun mouvement n\'est subi : on contrôle l\'aller comme le retour, et mieux vaut 5 répétitions justes que 20 approximatives. »'},{h:'🛟 Reformer ou Pilates au sol (mat)',pts:['Le mat, c\'est le poids du corps sur un tapis. Le <b>Reformer</b> est un chariot sur rails avec des ressorts, qui font deux choses : ils <b>aident</b> quand un mouvement est trop dur, et ils <b>résistent</b> quand on est prêt à aller plus loin. On dose l\'exercice au lieu de le sauter.','Le Reformer <b>va beaucoup plus loin que le mat</b> : <b>résistance réglable</b> (on renforce vraiment, cran par cran), <b>instabilité permanente</b> du chariot qui engage davantage les muscles profonds (une étude a mesuré plus d\'activation du transverse au Reformer qu\'au tapis, sur un même exercice), <b>travail en freinant</b> sur le retour du chariot (contre les ressorts, on renforce à l\'aller comme au retour).','En plus : la fin d\'amplitude travaillée sous résistance (on ne fait pas que s\'étirer, on se renforce en position étirée), un répertoire bien plus large (sangles, barre, positions), un feedback immédiat, beaucoup d\'exercices allongé ou assis, sans impact. Sur le mal de dos chronique, de petits essais comparatifs donnent même l\'avantage à l\'appareil sur certains critères.','On défend notre méthode avec des faits, jamais avec des surventes : interdits « le mat ne sert à rien », « résultats garantis », « mêmes résultats en moins de séances ».'],say:'« Le mat est une bonne base. Mais le Reformer va beaucoup plus loin : résistance réglable, instabilité permanente qui engage davantage les muscles profonds, travail en freinant sur le retour du chariot. »'},{h:'🏅 Du grand débutant au sportif aguerri',pts:['<b>La même machine s\'adapte à chacun</b> : pour un débutant, les ressorts aident à réussir le mouvement ; pour un sportif, on retire de l\'aide ou on ajoute de la résistance dès le premier cours.','L\'échelle : <b>0.5</b> (initiation, vrais débutants, aucune expérience requise), <b>1</b> (le cours signature : tous démarrent ici, même les initiés), <b>1.5</b> (se challenger en sécurité), <b>2</b> (après 30 à 60 cours), <b>2.5</b> (après 2 ans à 2×/semaine). Plus on monte, plus on ajoute d\'instabilité, de tempo et de combinaisons.','Un sportif démarre au <b>niveau 1, comme tout le monde</b> : on pose la précision avant la charge. Jamais de passage direct en niveau 2 ou 2.5 « vu son niveau » : les formats plus intenses s\'atteignent en progressant : Flow 2 et 2.5, puis Suspend (TRX) et FIT, qui arrivent après l\'ouverture.','Un Reformer a un nombre fini de ressorts : quand ils ne suffisent plus, on complique l\'exercice (sur une jambe, tempo, instabilité). Pour le sportif, c\'est le <b>complément de son sport</b> (gainage, mobilité, équilibre), un travail différent de la musculation.','<b>Venir à deux, même avec des niveaux différents</b> : chaque Reformer se règle avec des ressorts d\'intensité différente. Deux personnes de conditions physiques différentes réalisent et suivent le même cours, côte à côte, chacune à son niveau. Parfait pour des copines ou un couple : on s\'entraîne ensemble, et on annule moins quand quelqu\'un nous attend.'],say:'« Vous démarrez au niveau 1, comme tout le monde, mais les ressorts se règlent à votre force dès le premier cours, et les niveaux 2 et 2.5 sont réellement exigeants. »'},{h:'🧰 L\'équipement du studio',pts:['Le <b>Reformer</b>, conçu exclusivement pour Club Pilates, est au cœur des cours. Il est complété par le <b>Springboard</b> (le panneau mural à ressorts et sangles : renforcement et mobilité) et l\'<b>EXO Chair</b> (la chaise Pilates, renforcement ciblé).','Viennent aussi le <b>TRX</b> (sangles de suspension, gainage et stabilité), le <b>Bosu</b> (demi-ballon, équilibre et proprioception), le <b>TriggerPoint</b> (rouleaux d\'auto-massage, récupération), la <b>barre et le tapis</b> (pour varier, jamais la même séance).','Le <b>Cadillac</b>, proposé en <b>séance privée</b> : une table surmontée d\'un cadre à barres, ressorts et sangles, inventée elle aussi par Joseph Pilates. Plus complète encore que le Reformer, elle permet de travailler allongé, assis, à genoux ou debout. À ne jamais confondre avec le Springboard.','À citer si le prospect craint un cours « usine » ou trop facile : la variété des appareils, les niveaux du 0.5 au 2.5 et le petit groupe. On ne cite jamais un équipement que le studio n\'a pas.'],say:''}],qs:[{q:'Un prospect qui pratique déjà vous demande : « Comment Joseph Pilates appelait-il sa méthode ? » Que répondez-vous ?',ch:[{t:'« Centrologie, l\'idée que tout part du centre du corps. »',ok:false},{t:'« Contrology, l\'idée que l\'esprit contrôle le muscle. »',ok:true},{t:'« Powerhouse, l\'idée que tout part de la sangle abdominale. »',ok:false},{t:'« Centering, l\'idée que la force vient du bassin et du dos. »',ok:false}],fb:'Le terme exact est Contrology (contrôlogie) : l\'esprit contrôle le muscle. Le centrage (centering) est l\'un de ses six principes, d\'où la confusion avec « centrologie », et le powerhouse désigne le centre du corps, pas le nom de la méthode.'},{q:'« Le Pilates, c\'est une mode, non ? » Vous racontez l\'histoire de Joseph Pilates pendant la Première Guerre. Quelle version est juste ?',ch:[{t:'Infirmier sur le front, il a soigné les soldats blessés avec sa méthode.',ok:false},{t:'Médecin militaire, il a rééduqué les officiers dans les hôpitaux de l\'armée.',ok:false},{t:'Interné civil en Angleterre, il a fait pratiquer sa méthode aux autres internés.',ok:true},{t:'Entraîneur de boxe, il a préparé les soldats anglais au combat avec sa méthode.',ok:false}],fb:'Joseph Pilates était interné civil dans un camp en Angleterre et a fait pratiquer sa méthode aux autres internés, jusqu\'aux malades alités. Il n\'a pas soigné de soldats : c\'est une erreur répandue à ne jamais répéter.'},{q:'Un prospect vous demande d\'où vient le Reformer. Quelle formulation est la bonne ?',ch:[{t:'« Joseph Pilates l\'a inventé. Selon son histoire, ses premiers appareils sont nés pour la rééducation. »',ok:true},{t:'« C\'est une invention récente des salles de sport, apparue avec la mode du fitness en studio. »',ok:false},{t:'« Il est prouvé que Joseph Pilates a soigné des milliers de blessés sur des lits à ressorts. »',ok:false},{t:'« Il a été conçu pour les salles de musculation, comme une machine de charge lourde guidée. »',ok:false}],fb:'C\'est Joseph Pilates qui a inventé le Reformer, et l\'histoire des lits à ressorts se présente toujours avec « selon son histoire » : c\'est un récit, pas un fait prouvé, on ne l\'enjolive pas.'},{q:'« C\'est de la gym douce ? » Pour répondre, vous vous appuyez sur les 6 principes de la méthode. Lesquels ?',ch:[{t:'Concentration, force, cardio, précision, respiration, souplesse.',ok:false},{t:'Contrôle, vitesse, centrage, répétition, apnée, fluidité.',ok:false},{t:'Concentration, relaxation, centrage, puissance, étirement, endurance.',ok:false},{t:'Concentration, contrôle, centrage, précision, respiration, fluidité.',ok:true}],fb:'Les 6 principes sont concentration, contrôle, centrage, précision, respiration et fluidité. Ils montrent que c\'est un travail précis et contrôlé, où la respiration est coordonnée au mouvement et jamais bloquée.'},{q:'Un prospect vous demande : « Quelle différence avec le Pilates sur tapis ? » Quelle réponse courte donnez-vous ?',ch:[{t:'« Les ressorts font le travail à votre place : c\'est plus doux et moins fatigant que le tapis. »',ok:false},{t:'« Les ressorts vous aident ou vous résistent, et le chariot mobile fait travailler vos muscles profonds en continu. »',ok:true},{t:'« Les ressorts ajoutent de la charge lourde : c\'est de la musculation, en plus intense que le tapis. »',ok:false},{t:'« Les ressorts donnent les mêmes résultats que le tapis, mais en deux fois moins de séances. »',ok:false}],fb:'Les ressorts aident ET résistent, et l\'instabilité permanente du chariot engage davantage les muscles profonds : deux leviers que le tapis ne peut pas offrir. Promettre les mêmes résultats en moins de séances reste une survente interdite.'},{q:'Un prospect insiste : « Le Pilates sur tapis, c\'est bien aussi, non ? » Que répondez-vous ?',ch:[{t:'« Le mat est une bonne base. Le Reformer va plus loin : résistance réglable, instabilité, travail en freinant. »',ok:true},{t:'« Le mat est dépassé. Le Reformer est meilleur dans tous les cas, quels que soient votre âge et votre niveau. »',ok:false},{t:'« Le mat est bien pour débuter. Mais sur Reformer, vous progresserez bien plus vite qu\'au tapis, c\'est garanti. »',ok:false},{t:'« Le mat ne sert à rien pour le dos. Seul le Reformer fait vraiment travailler les muscles profonds du tronc. »',ok:false}],fb:'On défend le Reformer avec des faits : la résistance réglable des ressorts (on renforce vraiment), l\'instabilité permanente du chariot (une étude mesure plus d\'activation du transverse au Reformer qu\'au tapis), le travail en freinant sur le retour, et un coach qui corrige. Jamais « garanti », jamais « le mat ne sert à rien ».'},{q:'Un prospect très sportif vous dit : « Ça ne va pas être trop doux pour moi ? » Que répondez-vous ?',ch:[{t:'« Avec votre niveau, on vous inscrit directement en niveau 2 pour que ce soit assez intense. »',ok:false},{t:'« C\'est vrai que c\'est doux, mais ça vous fera du bien de vous détendre entre deux entraînements. »',ok:false},{t:'« Vous démarrez au niveau 1 comme tout le monde, avec des ressorts réglés à votre force dès le premier cours. »',ok:true},{t:'« Prenez le niveau 2.5 dès le départ : c\'est le cours expert, pensé exactement pour les sportifs comme vous. »',ok:false}],fb:'Même un sportif aguerri démarre au niveau 1 : on pose la précision avant la charge, mais les ressorts se règlent à sa force dès le premier cours. Le niveau 2 vient après 30 à 60 cours, le 2.5 après 2 ans à 2×/semaine.'},{q:'Un prospect qui a déjà pratiqué vous demande : « Et le Cadillac, vous en avez un ? » Que répondez-vous ?',ch:[{t:'« Oui, en séance privée : une table à barres, ressorts et sangles, encore plus complète que le Reformer. »',ok:true},{t:'« Oui, c\'est notre Springboard : la version murale du Cadillac, utilisée dans les cours collectifs. »',ok:false},{t:'« Non, le Cadillac n\'existe plus : Joseph Pilates l\'a remplacé par le Reformer dans les années 1920. »',ok:false},{t:'« Oui, dans tous nos cours collectifs : il remplace le Reformer une séance sur deux, pour varier. »',ok:false}],fb:'Le Cadillac est proposé en séance privée : une table surmontée d\'un cadre à barres, ressorts et sangles, plus complète encore que le Reformer. Le Springboard, lui, est un panneau mural à ressorts : rien à voir.'},{q:'Une prospecte vous dit : « Ma copine est très sportive, moi pas du tout : on ne pourra pas suivre le même cours. » Que répondez-vous ?',ch:[{t:'« Si : chacune règle les ressorts de son Reformer à sa force, et vous suivez le même cours ensemble. »',ok:true},{t:'« Non : il faudra réserver deux cours différents, chacune dans le niveau qui lui correspond. »',ok:false},{t:'« Oui, mais vous devrez d\'abord rattraper son niveau avec quelques séances privées. »',ok:false},{t:'« Oui, à condition de prendre toutes les deux l\'Illimité pour garder exactement le même rythme. »',ok:false}],fb:'Les ressorts d\'intensité différente se règlent poste par poste : deux conditions physiques différentes réalisent le même cours, côte à côte. Argument fort pour des copines ou un couple, et venir à deux, c\'est aussi plus de régularité.'}]},
  {id:'k3',ic:'💪',t:'Les muscles sollicités',sub:'Pas des abdos pour les tablettes : les muscles profonds qui tiennent la colonne, et comment en parler simplement au téléphone.',lesson:[{h:'🎯 Pas des tablettes : les muscles profonds',pts:['Le grand droit, le muscle « visible » des tablettes, travaille aussi, mais <b>ce n\'est pas la priorité</b>. Le Pilates vise les <b>muscles profonds</b> qu\'on ne voit pas et qui <b>tiennent la colonne</b>.','Les deux noms à connaître : le <b>transverse</b>, une ceinture naturelle autour du ventre, et les <b>multifides</b>, tout le long de la colonne.','Ces muscles se recrutent avec la respiration : <b>chaque expiration serre la ceinture</b>. Le souffle n\'est pas seulement de la relaxation, c\'est le moteur de l\'exercice.'],say:'« Le Pilates, ce n\'est pas des abdos pour avoir des tablettes : ce sont les muscles profonds qu\'on ne voit pas et qui tiennent votre colonne. »'},{h:'🧭 Centrage, powerhouse et gainage',pts:['Le <b>centrage</b> est l\'un des six principes de la méthode : chaque mouvement part du centre du corps, <b>jamais des bras ou des jambes seuls</b>.','Ce centre s\'appelle le <b>powerhouse</b> : abdos, bas du dos, bassin et fessiers. Ce n\'est donc pas seulement le ventre.','Le <b>gainage</b>, c\'est la capacité des muscles profonds du tronc à stabiliser la colonne pendant l\'effort. Ici, ce n\'est pas une position à tenir : c\'est <b>la base active de chaque mouvement</b>.','Sur Reformer, le chariot mobile oblige les muscles profonds à stabiliser le corps : du gainage « caché » dans la plupart des exercices.'],say:'« Ici le gainage n\'est pas un exercice de fin de séance : c\'est la base de chaque mouvement. Votre centre travaille pendant les 50 minutes. »'},{h:'🫁 La sangle abdominale, un caisson',pts:['<b>Transverse</b> : le muscle le plus profond du ventre, horizontal, effet corset. Il se contracte à l\'expiration et aide à soutenir les lombaires.','<b>Obliques</b> internes et externes : rotation, inclinaison et stabilité latérale du tronc, ils gainent les côtés de la taille. <b>Grand droit</b> : le muscle visible, pas la priorité.','<b>Diaphragme</b> (le grand muscle de la respiration, sous les poumons) et <b>plancher pelvien</b> (un hamac de muscles qui ferme le bas du bassin) sont le toit et le plancher du caisson : ils travaillent avec le transverse.','On <b>expire sur l\'effort</b> : l\'expiration active le transverse et le plancher pelvien, ce qui stabilise la colonne au moment où elle en a le plus besoin.','Post-partum : le Pilates renforce le plancher pelvien en douceur, sans impact, <b>après le feu vert de la sage-femme ou du médecin</b>, en complément de la rééducation du périnée, <b>jamais à sa place</b>.'],say:''},{h:'🦴 Le dos, ce qui tient la posture',pts:['<b>Multifides</b> : petits muscles profonds étagés de vertèbre en vertèbre, ils stabilisent la colonne. Ils s\'affaiblissent très tôt en cas de lombalgie et ne se remettent pas toujours seuls sans exercice ciblé.','<b>Érecteurs du rachis</b> : les longs muscles de chaque côté de la colonne, qui redressent le dos et tiennent la posture. <b>Carré des lombes</b> : entre la dernière côte et le bassin, il stabilise le bas du dos.','<b>Trapèzes</b> (faisceaux moyen et inférieur) et <b>rhomboïdes</b> : entre les omoplates, ils tiennent les épaules en arrière et en bas. Ce sont les muscles de la posture « bureau ».','<b>Grand dorsal</b> : il travaille dès qu\'on tire avec les bras ou qu\'on appuie vers le bas. <b>Dentelé antérieur</b> : il plaque l\'omoplate contre les côtes, clé dans les appuis sur les mains.','<b>Grand fessier</b> : il prolonge la chaîne arrière du corps. Un fessier faible peut faire travailler les lombaires à sa place.'],say:'« Entre les omoplates, les trapèzes et les rhomboïdes tiennent vos épaules en arrière et en bas : ce sont justement les muscles de la posture bureau. »'},{h:'📞 En parler au téléphone, sans survendre',pts:['Comme pour les bienfaits, <b>1 ou 2 réponses courtes</b>, jamais une liste en monologue : 1 ou 2 muscles choisis selon l\'objectif du prospect. Mal de dos → multifides ; ventre ou post-partum → transverse et plancher pelvien ; journées sur écran → trapèzes et rhomboïdes.','Une <b>image simple</b> parle plus qu\'un terme d\'anatomie : ceinture, corset, caisson, hamac.','On ne promet jamais de tablettes ni de guérison du mal de dos. En cas de douleur ou de pathologie, on vérifie le <b>feu vert du médecin</b> : ensuite, le Reformer est un atout.','Le Pilates est efficace, mais on ne le présente jamais comme supérieur aux autres exercices encadrés : <b>on ne survend jamais</b>.'],say:''}],qs:[{q:'Un prospect vous demande : « Ça travaille quoi, les abdos pour avoir des tablettes ? » Que répondez-vous ?',ch:[{t:'« Oui, c\'est l\'un des meilleurs moyens d\'avoir des abdominaux bien dessinés. »',ok:false},{t:'« Surtout les muscles profonds qu\'on ne voit pas et qui tiennent votre colonne. »',ok:true},{t:'« Surtout les bras et les jambes, le ventre se travaille à part en fin de séance. »',ok:false},{t:'« Surtout la souplesse : c\'est avant tout un travail d\'étirement en douceur. »',ok:false}],fb:'Le Pilates cible les muscles profonds qui tiennent la colonne, comme le transverse et les multifides. Le grand droit, le muscle visible des tablettes, travaille mais n\'est pas la priorité.'},{q:'Votre prospect a entendu parler du « powerhouse » par une amie. Comment le lui expliquez-vous ?',ch:[{t:'« Le nom d\'un cours de niveau 2, plus intense, réservé aux sportifs confirmés. »',ok:false},{t:'« Les abdominaux visibles, ceux qu\'on travaille pour avoir un ventre dessiné. »',ok:false},{t:'« Le centre du corps : abdos, bas du dos, bassin et fessiers. Tout part de là. »',ok:true},{t:'« Le réglage de ressorts le plus lourd du Reformer, pour les plus avancés. »',ok:false}],fb:'Le powerhouse est le centre du corps en Pilates (abdos, bas du dos, bassin, fessiers). Selon le principe du centrage, chaque mouvement part de là.'},{q:'Un prospect vous dit : « Le gainage, je connais, je fais déjà la planche chez moi. » Quelle nuance apportez-vous ?',ch:[{t:'« Ici, le gainage n\'est pas une position à tenir : c\'est la base de chaque mouvement. »',ok:true},{t:'« C\'est la même chose, on termine aussi chaque cours par une série de planches. »',ok:false},{t:'« Le gainage n\'a pas sa place en Pilates, la méthode travaille surtout la souplesse. »',ok:false},{t:'« Ici, on tient simplement la planche plus longtemps, sur le Reformer au lieu du sol. »',ok:false}],fb:'Le gainage, c\'est la capacité des muscles profonds du tronc à stabiliser la colonne pendant l\'effort. En Pilates, c\'est la base active de chaque mouvement : le centre travaille pendant les 50 minutes.'},{q:'Un prospect demande pourquoi les coachs insistent autant sur l\'expiration pendant l\'effort. Quelle explication donnez-vous ?',ch:[{t:'« L\'expiration relâche les abdominaux, pour que le mouvement demande moins d\'effort. »',ok:false},{t:'« L\'expiration sert surtout à se détendre, sans lien avec les muscles travaillés. »',ok:false},{t:'« L\'expiration donne de la force aux bras et aux jambes, pour pousser le chariot. »',ok:false},{t:'« L\'expiration active le transverse et le plancher pelvien, ce qui stabilise la colonne. »',ok:true}],fb:'On expire sur l\'effort : chaque expiration « serre la ceinture », elle active le transverse et le plancher pelvien, qui stabilisent la colonne. Le souffle est le moteur de l\'exercice.'},{q:'Une prospecte souffre de lombalgie et vous demande en quoi le Pilates peut l\'aider. Quelle réponse est la bonne ?',ch:[{t:'« On travaille les multifides, et en quelques séances votre lombalgie aura disparu. »',ok:false},{t:'« On travaille les multifides, qui stabilisent la colonne, avec l\'avis de votre médecin. »',ok:true},{t:'« On travaille surtout le grand droit, c\'est lui qui protège le bas du dos des douleurs. »',ok:false},{t:'« On travaille les multifides, et pas besoin de médecin : le Reformer est sans risque. »',ok:false}],fb:'Les multifides stabilisent la colonne vertèbre par vertèbre et s\'affaiblissent très tôt en cas de lombalgie. On ne promet jamais de guérison, et en cas de douleur on renvoie toujours à l\'avis du médecin.'},{q:'Une jeune maman veut renforcer son périnée après l\'accouchement. Que lui répondez-vous ?',ch:[{t:'« Le Pilates remplace la rééducation du périnée, vous pouvez commencer quand vous voulez. »',ok:false},{t:'« Le périnée ne se travaille pas en Pilates, mieux vaut vous limiter à votre kiné. »',ok:false},{t:'« Venez dès maintenant : le Reformer est doux, l\'avis de votre sage-femme est inutile. »',ok:false},{t:'« Après le feu vert de votre sage-femme ou médecin, le Pilates complète la rééducation. »',ok:true}],fb:'Le plancher pelvien travaille avec le transverse et se renforce en douceur, sans impact. Mais seulement après le feu vert de la sage-femme ou du médecin, en complément de la rééducation du périnée, jamais à sa place.'},{q:'Un prospect passe ses journées devant un écran, les épaules enroulées vers l\'avant. Quels muscles lui citez-vous ?',ch:[{t:'« Le grand droit, qui redresse le haut du dos et ramène les épaules en arrière. »',ok:false},{t:'« Les trapèzes et les rhomboïdes, qui tiennent les épaules en arrière et en bas. »',ok:true},{t:'« Le carré des lombes, qui place les épaules et tient la nuque bien droite. »',ok:false},{t:'« Les obliques, qui ramènent les omoplates en arrière et redressent la tête. »',ok:false}],fb:'Les trapèzes (faisceaux moyen et inférieur) et les rhomboïdes, entre les omoplates, tiennent les épaules en arrière et en bas : ce sont les muscles de la posture « bureau ».'},{q:'Un prospect vous demande quels muscles travaillent en Pilates. Quelle est la bonne approche ?',ch:[{t:'Lui réciter tous les muscles du dos et du ventre, pour montrer votre expertise.',ok:false},{t:'Rester vague en disant que « tout le corps travaille », sans aucun détail.',ok:false},{t:'Écourter et passer au prix : les muscles n\'intéressent pas vraiment les prospects.',ok:false},{t:'Citer 1 ou 2 muscles profonds liés à son objectif, avec une image simple.',ok:true}],fb:'Au téléphone, 1 ou 2 réponses courtes reliées à l\'objectif du prospect, jamais un monologue. Une image (ceinture, corset, caisson) parle plus qu\'un terme d\'anatomie.'}]},
  {id:'k4',ic:'🫁',t:'L\'importance de la respiration',sub:'Le souffle, moteur de l\'exercice · technique, sécurité et argument anti-stress, sans jamais survendre',lesson:[{h:'🫁 Le souffle, moteur de l\'exercice',pts:['La <b>Respiration</b> est l\'un des 6 principes de la méthode (avec Concentration, Contrôle, Centrage, Précision, Fluidité) : <b>coordonnée au mouvement, jamais bloquée</b>.','Elle recrute les muscles profonds qui tiennent la colonne, à commencer par le <b>transverse</b>, une ceinture naturelle autour du ventre. <b>Chaque expiration serre cette ceinture</b>.','Le souffle n\'est donc <b>pas seulement de la relaxation</b> : c\'est le moteur de l\'exercice. C\'est la réponse à « pourquoi vous insistez autant sur la respiration ? ».','La phrase courte à retenir mot pour mot est ci-dessous. Au téléphone : 1 ou 2 phrases courtes, jamais un cours de physiologie en monologue.'],say:'« En Pilates, la respiration n\'accompagne pas le mouvement, elle le déclenche. »'},{h:'🌬️ La technique : latérale, et on expire sur l\'effort',pts:['On respire <b>latéralement</b> : avec le <b>diaphragme</b> (le grand muscle de la respiration, sous les poumons), en dirigeant l\'air <b>vers les côtes plutôt que dans le ventre</b>, pour garder les abdominaux engagés.','À ne pas confondre : on ne gonfle pas le ventre, on écarte les côtes.','On <b>expire sur l\'effort</b> : l\'expiration active le <b>transverse et le plancher pelvien</b>, ce qui stabilise la colonne au moment où elle en a le plus besoin.','<b>Le test en direct, et à quoi il sert</b> : au téléphone, proposez « Posez une main sur vos côtes et inspirez en les écartant ». En 10 secondes, le prospect <b>vit la méthode</b> sans être au studio, <b>sent la différence</b> (l\'air va dans les côtes, le ventre reste gainé) et comprend que le souffle est une <b>technique qui fait travailler les muscles profonds</b>, pas de la relaxation. Un mini-cours qui crée l\'envie et vous rend crédible.'],say:'« Posez une main sur vos côtes et inspirez en les écartant… Vous sentez ? Le ventre reste gainé : c\'est exactement la respiration qu\'on travaille en cours, et c\'est elle qui fait travailler vos muscles profonds. »'},{h:'⛔ Ne jamais bloquer son souffle',pts:['En musculation, on retient souvent son souffle pour soulever lourd : ça <b>rigidifie bien la colonne</b>, c\'est pour ça qu\'on le fait.','Le vrai risque est ailleurs : la pression dans le ventre grimpe d\'un coup, elle <b>pousse sur le périnée</b> et <b>fait monter la tension artérielle</b>.','Ne dites jamais que bloquer « fragilise la colonne » ou « abîme le dos » : ce n\'est pas le vrai risque, et un sportif vous reprendrait.','En Pilates, on apprend à <b>gainer tout en respirant</b> : précieux en cas de petites fuites ou après une grossesse, une fois le feu vert de la sage-femme ou du médecin obtenu, en complément de la rééducation du périnée, jamais à sa place.'],say:'« En Pilates, on apprend à gainer tout en respirant, sans jamais bloquer son souffle. »'},{h:'🌿 L\'argument stress : mesurable, pas décoratif',pts:['<b>Un état semi-méditatif</b> : concentré sur le souffle et la précision du geste, on n\'a plus la tête ailleurs. Beaucoup ressortent l\'esprit vidé, plus léger.','Pour un prospect qui vient pour le stress, le bien-être ou une tête plus claire : la respiration profonde qui guide chaque mouvement <b>fait baisser le cortisol</b>, l\'hormone du stress.','La source : une <b>revue systématique JBI 2019</b> (une synthèse de plusieurs études) et des essais contrôlés. La respiration diaphragmatique y réduit le cortisol salivaire, le rythme respiratoire et le stress perçu.','Précision : ce qui est étudié, c\'est <b>ce type de respiration profonde</b>, pas Club Pilates ni nos membres. On dit « ce type de respiration est étudié en laboratoire ».','On ne survend jamais : pas de « guérit l\'anxiété », pas de « mieux que le yoga ». Le Pilates est <b>efficace, mais pas magique</b>, avec de la régularité.','Si le prospect signale un <b>problème respiratoire</b>, cochez-le à l\'étape santé : l\'app adapte la recommandation de cours. En cas de doute, orientez vers l\'avis du coach ou du médecin.'],say:'« Concentré sur le souffle et le geste, on entre dans un état semi-méditatif : la tête se vide. Et ce type de respiration profonde est étudié en laboratoire : il fait baisser le cortisol, l\'hormone du stress. »'}],qs:[{q:'Un prospect vous dit : « Pourquoi vous insistez autant sur la respiration ? C\'est pour se détendre ? » Que répondez-vous ?',ch:[{t:'« Oui, c\'est surtout un moment de détente entre deux exercices difficiles. »',ok:false},{t:'« Pas seulement : chaque expiration serre le transverse, c\'est le moteur de l\'exercice. »',ok:true},{t:'« C\'est pour mieux oxygéner les muscles et brûler davantage de graisses. »',ok:false},{t:'« C\'est une tradition de la méthode, ça ne change rien au travail musculaire. »',ok:false}],fb:'Le souffle n\'est pas seulement de la relaxation : à chaque expiration, il recrute le transverse, la ceinture naturelle du ventre. C\'est le moteur de l\'exercice.'},{q:'Un prospect vous demande de résumer en une phrase le rôle du souffle en Pilates. Quelle phrase choisissez-vous ?',ch:[{t:'« La respiration accompagne le mouvement, à son propre rythme. »',ok:false},{t:'« Le mouvement d\'abord, la respiration suit toute seule. »',ok:false},{t:'« La respiration n\'accompagne pas le mouvement, elle le déclenche. »',ok:true},{t:'« On respire entre les exercices, jamais pendant le mouvement. »',ok:false}],fb:'C\'est la phrase courte à retenir : le souffle ne suit pas le geste, il le lance, car l\'expiration active les muscles profonds au moment de l\'effort.'},{q:'Un prospect vous demande : « Et on respire comment, en Pilates ? » Que répondez-vous ?',ch:[{t:'Latéralement, avec le diaphragme, l\'air dirigé vers les côtes.',ok:true},{t:'En gonflant le ventre au maximum à chaque inspiration.',ok:false},{t:'En apnée pendant le mouvement, puis on souffle entre deux.',ok:false},{t:'Librement, chacun respire comme il le sent pendant l\'effort.',ok:false}],fb:'On dirige l\'air vers les côtes plutôt que dans le ventre, pour garder les abdominaux engagés pendant qu\'on respire.'},{q:'Au téléphone, une prospecte veut « sentir » ce qu\'est la respiration Pilates. Que lui proposez-vous, et pourquoi ?',ch:[{t:'La main sur les côtes, inspirer en les écartant : elle sent le souffle latéral qui gaine le ventre.',ok:true},{t:'Retenir son souffle quelques secondes : elle sentira son ventre se gainer tout seul.',ok:false},{t:'Inspirer fort en gonflant le ventre : elle sentira ses abdominaux se relâcher d\'un coup.',ok:false},{t:'Rien : ça ne s\'explique pas, elle le découvrira le jour de son tout premier cours.',ok:false}],fb:'Ce test sert à trois choses : lui faire vivre la méthode en 10 secondes, sans être au studio ; lui faire sentir la respiration latérale (l\'air dans les côtes, le ventre reste gainé) ; lui montrer que le souffle est une technique qui fait travailler les muscles profonds, pas de la relaxation. Un mini-cours au téléphone qui crée l\'envie et vous rend crédible.'},{q:'Un prospect vous demande : « Et au moment de l\'effort, je fais quoi avec mon souffle ? » Que répondez-vous ?',ch:[{t:'On inspire, pour remplir les poumons et avoir plus de force.',ok:false},{t:'On bloque, pour verrouiller le ventre le temps de la poussée.',ok:false},{t:'On expire, ce qui active le transverse et stabilise la colonne.',ok:true},{t:'Peu importe, tant que le rythme reste régulier et calme.',ok:false}],fb:'On expire sur l\'effort : l\'expiration active le transverse et le plancher pelvien, ce qui stabilise la colonne au moment où elle en a le plus besoin.'},{q:'Un prospect qui fait de la musculation vous dit : « Moi, je bloque ma respiration quand je pousse lourd. » Quelle explication est juste ?',ch:[{t:'Bloquer fragilise la colonne et finit, à la longue, par abîmer les disques du dos.',ok:false},{t:'Ça rigidifie la colonne, mais ça pousse sur le périnée et fait monter la tension artérielle.',ok:true},{t:'Aucun souci, c\'est d\'ailleurs exactement ce qu\'on fait à chaque exercice sur le Reformer.',ok:false},{t:'Ça n\'a aucun effet particulier sur le corps, c\'est juste une habitude de salle de sport.',ok:false}],fb:'Le blocage rigidifie bien la colonne, d\'où son usage en musculation lourde. Le vrai risque est la pression sur le périnée et la hausse de tension artérielle : en Pilates, on gaine en respirant.'},{q:'Une prospecte vous dit qu\'elle vient surtout pour décompresser. Quel argument est juste, sans survente ?',ch:[{t:'« On entre dans un état semi-méditatif, et cette respiration fait baisser le cortisol. »',ok:true},{t:'« Le Pilates guérit l\'anxiété, toutes les études le prouvent clairement. »',ok:false},{t:'« Le Pilates fait baisser le stress bien plus que le yoga ou la méditation. »',ok:false},{t:'« Une étude sur nos membres montre la fin du stress dès le premier mois. »',ok:false}],fb:'Concentré sur le souffle et le geste, on entre dans un état semi-méditatif ; et la respiration profonde fait baisser le cortisol et le stress perçu (revue systématique JBI 2019, essais contrôlés). On ne promet pas de guérison et on n\'invente ni comparaison ni étude.'},{q:'Une prospecte qui a déjà pratiqué vous demande comment la méthode définit la Respiration parmi ses 6 principes. Que répondez-vous ?',ch:[{t:'Libre, chacun respire à son propre rythme.',ok:false},{t:'Retenue pendant l\'effort, relâchée au repos.',ok:false},{t:'Profonde, réservée aux étirements de fin de séance.',ok:false},{t:'Coordonnée au mouvement, jamais bloquée.',ok:true}],fb:'La Respiration est coordonnée au mouvement et jamais bloquée, aux côtés de la Concentration, du Contrôle, du Centrage, de la Précision et de la Fluidité.'}]},
  {id:'k5',ic:'🧭',t:'Les cours & les niveaux',sub:'Les 5 niveaux, nos cours à l\'ouverture, le bon cours pour chaque profil et la question santé',lesson:[{h:'🪜 L\'échelle des 5 niveaux',pts:['<b>5 niveaux, de 0.5 à 2.5</b> : 0.5 Initiation (vrais débutants, aucune expérience requise), 1 Fondation (le cours signature), 1.5 Progression (se challenger en sécurité).','<b>Level 2 · Évolution</b> (challenge +++) s\'ouvre en général après 30 à 60 cours. <b>Level 2.5 · Mastery</b> : membres très avancés, après 2 ans à 2 séances par semaine.','<b>Tout le monde démarre au niveau 1, même les initiés et les sportifs</b> (les vrais débutants y ajoutent le 0.5 en tout premier) : on pose la précision avant la charge, et les ressorts se règlent à la force de chacun dès le premier cours. On ne promet jamais un accès direct au niveau 2.','Chaque séance dure <b>50 minutes</b>, en groupe de <b>12 personnes maximum</b> : le coach diplômé passe à chaque poste et corrige individuellement.'],say:'« Vous démarrez au niveau 1, comme tout le monde, même les initiés : les ressorts se règlent à votre force dès le premier cours. »'},{h:'📅 Nos cours à l\'ouverture',pts:['<b>Dès l\'ouverture, 3 types de cours</b> : <b>Flow</b> (le cœur de la méthode, du Foundation 0.5 au Flow 2.5 selon la progression), <b>Cardio Sculpt</b> (cardio à faible impact, une fois les bases posées) et <b>Center & Balance</b> (étirements assistés, idéal débutant ou senior).','<b>Ensuite</b> arrivent <b>Suspend</b> (TRX : équilibre et stabilité) et <b>FIT</b> (haute intensité). Ne les promettez jamais pour le premier jour.','<b>Flow 1</b> (allongé) est le cours signature et le point de départ de tous ; <b>Flow 1.5</b> (à genoux) puis <b>Flow 2</b> (debout) se débloquent en progressant.','Ne citez jamais un cours qui n\'est pas à notre planning : la fiche 📚 Les cours de l\'app indique la disponibilité de chacun.'],say:'« Dès l\'ouverture, vous avez le Flow, le Cardio Sculpt et le Center & Balance. Le Suspend et le FIT arrivent ensuite. »'},{h:'🎯 Quel cours pour quel objectif',pts:['La recommandation part <b>toujours du Flow 1</b>. Jamais fait de sport, 55-70 ans ou senior : on ajoute le <b>Foundation 0.5</b> en tout premier.','Le 2e cours suit l\'objectif : <b>perte de poids ou tonicité → Cardio Sculpt 1</b> (une fois les bases posées) ; <b>mobilité, posture, douleurs ou stress → Center & Balance</b>.','Si la santé ne permet pas le Cardio Sculpt, on bascule vers <b>Center & Balance</b>. Exemple : perte de poids + genou fragile = Center & Balance plutôt que Cardio Sculpt 1.','Avec l\'Illimité, on combine les 3 types de cours : Flow, Cardio Sculpt et Center & Balance. Les alertes santé affichées par l\'app se valident toujours avec le coach.'],say:''},{h:'🌱 Le Level 0.5, votre arme commerciale',pts:['Sortez-le dès que vous entendez : « je n\'ai jamais fait », « j\'ai peur », « je suis débutant », « senior », « mal au dos », « ça a l\'air dur ».','Il transforme la peur du débutant en confort, justifie l\'engagement de 3 mois et vous différencie de la salle classique.','Il rassure les 55-70 ans, les blessés (avec le feu vert du médecin) et les sédentaires. Ne jamais avoir fait est même un avantage : aucune mauvaise habitude.','Rassurer n\'est pas survendre : ne promettez jamais que « tout est facile », les niveaux 2 et 2.5 sont réellement exigeants.'],say:'« Chez nous, vous ne sautez pas dans le bain : vous démarrez au niveau 0.5, un cours d\'initiation conçu pour ceux qui n\'ont jamais touché un Reformer. Aucune pression, à votre rythme. »'},{h:'🩺 La santé : le médecin d\'abord',pts:['Posez toujours la question santé pendant la découverte : cochée dans l\'app, elle adapte la recommandation de cours.','<b>Feu vert du médecin, et c\'est parti</b> : après une opération, une blessure ou pendant un suivi, on demande si le médecin autorise le sport. Si oui, aucun problème, au contraire : le Reformer est idéal pour reprendre (sans impact, articulations soutenues, charge réglée), et le coach s\'adapte à ses consignes. On ne remplace jamais un soin.','<b>Post-partum</b> : uniquement après le feu vert de la sage-femme ou du médecin, en complément de la rééducation du périnée, jamais à sa place.','Ne promettez jamais qu\'un cours soigne ou remplace un soin, et ne remettez jamais en cause l\'avis d\'un médecin. En cas de doute sur un cours, orientez vers le coach ou le médecin.'],say:'« Votre médecin vous autorise le sport ? Alors aucun problème, au contraire : le Reformer est idéal pour reprendre, sans impact, et le coach s\'adapte à ses consignes. »'}],qs:[{q:'Un prospect très sportif vous dit : « Je cours des marathons, je peux commencer directement en niveau 2 ? » Que répondez-vous ?',ch:[{t:'« Avec votre profil sportif, le coach vous placera directement en Flow 2, debout, dès le 1er cours. »',ok:false},{t:'« Vous passez d\'abord par le Level 0.5 obligatoire, puis le niveau 2 vous sera ouvert après un mois. »',ok:false},{t:'« Vous démarrez au niveau 1 comme tout le monde : les ressorts se règlent à votre force dès le 1er cours. »',ok:true},{t:'« Après vos 5 premières séances en niveau 1, vous basculerez automatiquement en niveau 2. »',ok:false}],fb:'Tout le monde démarre au niveau 1, même les initiés : on pose la précision avant la charge, les ressorts s\'adaptent à sa force, et le niveau 2 vient après 30 à 60 cours.'},{q:'Un prospect demande : « Une séance dure combien de temps, et vous êtes combien par cours ? » Quelle réponse est juste ?',ch:[{t:'45 minutes, avec 15 personnes maximum',ok:false},{t:'50 minutes, avec 12 personnes maximum',ok:true},{t:'1 heure, avec 12 personnes maximum',ok:false},{t:'50 minutes, avec 20 personnes maximum',ok:false}],fb:'Une séance dure 50 minutes, en groupe de 12 personnes maximum : le coach passe à chaque poste et corrige individuellement.'},{q:'Une prospecte vous confie : « Je n\'ai jamais fait de sport, ça a l\'air dur, j\'ai peur de ne pas suivre. » Quelle est la meilleure réponse ?',ch:[{t:'Lui conseiller de se remettre en forme seule quelques semaines avant de s\'inscrire au studio.',ok:false},{t:'Lui recommander le FIT 2 pour qu\'elle voie vite des résultats et reprenne confiance en elle.',ok:false},{t:'Lui assurer que tous les cours sont faciles, quel que soit le format ou le niveau choisi.',ok:false},{t:'Lui présenter le Level 0.5 : une initiation pensée pour ceux qui n\'ont jamais touché un Reformer.',ok:true}],fb:'« Jamais fait », « peur », « ça a l\'air dur » : c\'est le signal pour sortir le Level 0.5, qui transforme la peur du débutant en confort. Promettre que tout est facile serait une survente.'},{q:'Un prospect demande : « Au bout de combien de temps je pourrai passer au niveau 2 ? » Quelle réponse est juste ?',ch:[{t:'« En général après 30 à 60 cours, en progressant depuis le niveau 1. »',ok:true},{t:'« En général après une dizaine de cours, dès que vous vous sentez en forme. »',ok:false},{t:'« Seulement après 2 ans de pratique, à raison de 2 séances par semaine. »',ok:false},{t:'« Dès la fin de votre engagement de 3 mois, quel que soit votre rythme. »',ok:false}],fb:'Le Level 2 s\'ouvre en général après 30 à 60 cours. Les 2 ans à 2 séances par semaine, c\'est le repère du Level 2.5 Mastery.'},{q:'Un prospect veut perdre du poids mais vous signale un genou fragile. Après le Flow 1, quel 2e cours l\'app lui recommande-t-elle ?',ch:[{t:'Cardio Sculpt 1, le cardio à faible impact',ok:false},{t:'Center & Balance, les étirements assistés',ok:true},{t:'FIT 2, l\'entraînement haute intensité',ok:false},{t:'Suspend 2, l\'entraînement au TRX',ok:false}],fb:'Quand la santé ne permet pas le Cardio Sculpt, Center & Balance prend le relais : c\'est ce que fait l\'app. FIT et Suspend n\'arrivent qu\'après l\'ouverture et ne se proposent jamais pour démarrer.'},{q:'Une prospecte demande : « Quels cours proposerez-vous à l\'ouverture ? » Que répondez-vous ?',ch:[{t:'« Le Flow, le Cardio Sculpt et le Center & Balance. Le Suspend et le FIT arrivent ensuite. »',ok:true},{t:'« Le Flow, le FIT et le Restore. Le Cardio Sculpt et le Suspend arrivent un peu plus tard. »',ok:false},{t:'« Tous les cours du catalogue Club Pilates, FIT et Suspend compris, dès le tout premier jour. »',ok:false},{t:'« Uniquement le Flow 1 pendant un an, puis tous les autres cours ouvriront en même temps. »',ok:false}],fb:'Dès l\'ouverture : 3 types de cours, Flow, Cardio Sculpt et Center & Balance. Suspend (TRX) et FIT arrivent ensuite. Ne promettez jamais un cours qui n\'est pas encore au planning.'},{q:'Un prospect vous dit : « J\'ai un problème de dos suivi par mon médecin, je peux quand même venir ? » Que répondez-vous ?',ch:[{t:'« Pas besoin de son avis : le Reformer a été conçu pour soigner les problèmes de dos. »',ok:false},{t:'« Si votre médecin vous autorise le sport, venez : c\'est même idéal pour le dos, sans impact. »',ok:true},{t:'« Les médecins sont toujours prudents, mais bouger ne fait jamais de mal : venez dès demain ! »',ok:false},{t:'« Prenez le Center & Balance : c\'est le cours qui remplace vos séances de kiné pour le dos. »',ok:false}],fb:'On vérifie le feu vert du médecin pour le sport. S\'il est donné, le Reformer est un atout pour le dos (sans impact, colonne soutenue) et le coach suit ses consignes. On ne remplace jamais un soin et on ne dit jamais que le Reformer soigne.'},{q:'Une prospecte a accouché il y a deux mois et veut retrouver sa tonicité. Que lui dites-vous ?',ch:[{t:'« Le Pilates remplace la rééducation du périnée : vous pouvez démarrer dès la semaine prochaine. »',ok:false},{t:'« Commencez par le FIT 2 : la haute intensité vous aidera à retrouver votre ligne au plus vite. »',ok:false},{t:'« Dès que vous avez le feu vert de votre sage-femme ou de votre médecin, on reprend en sécurité. »',ok:true},{t:'« Chez nous, la règle est d\'attendre un an après l\'accouchement avant de faire une séance. »',ok:false}],fb:'Le post-partum se reprend uniquement après le feu vert de la sage-femme ou du médecin, en complément de la rééducation du périnée, jamais à sa place.'}]},
  {id:'k6',ic:'💶',t:'Nos tarifs & conditions',sub:'La grille de lancement, l\'offre fondateur, la facturation et la bonne façon d\'annoncer un prix',lesson:[{h:'💶 La grille de lancement · TTC / mois',pts:['<b>Pack 4</b> · 4 séances / mois · <b>{P1}</b>. Pas de remise fondateur, mais <b>1 séance offerte par mois pendant les 3 premiers mois</b> : 5 séances pour {P1}, soit {P1S} la séance au lieu de {P1N}.','<b>Pack 8</b> · 8 séances / mois · {P2}, ramené à <b>{P2F}</b> pour les membres fondateurs (-{FOUND} à vie), soit <b>{P2FS} la séance</b> au lieu de {P2S}.','<b>Illimité</b> · {P3}, ramené à <b>{P3F}</b> en fondateur (-{FOUND} à vie). À 4 séances par semaine, la séance revient à {P3FS16}, et à 5 séances à {P3FS20} : des prix indicatifs, qui dépendent de la fréquentation réelle (le pense-bête le recalcule selon le nombre de cours par semaine).','<b>Hors forfait</b> : séance à l\'unité <b>{UNIT}</b>, séance privée <b>{PRIV}</b>. Ne confondez pas les deux.'],say:'« Pour le lancement, le Pack 4 vous offre 1 séance chaque mois pendant vos 3 premiers mois · 5 séances pour {P1}, soit {P1S} la séance. »'},{h:'🏛️ Offre fondateur & conditions',pts:['La remise <b>-{FOUND} à vie</b> concerne <b>uniquement le Pack 8 et l\'Illimité</b>, et seulement pour les <b>{SPOTS} premiers membres</b>.','<b>Frais d\'inscription offerts</b> (valeur 149 €), quelle que soit la formule.','<b>Engagement 3 mois</b> à partir de l\'ouverture, <b>tacitement renouvelable</b>. Dites-le clairement : la transparence crée la confiance.','<b>Places fondateur</b> : {SPOTS} au départ. On n\'a pas le chiffre exact à la minute, mais elles partent vite : dites-le, c\'est votre levier d\'urgence. Jamais de chiffre inventé (« il en reste 3 »).','Les prix sont ceux de la grille : vous improvisez la forme, jamais le fond. Jamais de remise ni de condition inventée.','<b>Parrainage</b> : -25 € pour le parrain et -25 € pour le filleul, sur leur <b>prochain prélèvement</b>, <b>cumulable</b> avec l\'offre fondateur. Le parrain doit <b>déjà être inscrit</b>. À proposer après le oui (« Vous connaissez quelqu\'un que ça pourrait motiver ? ») et dès qu\'un prospect dit qu\'un proche est déjà membre : ce proche peut le parrainer.'],say:''},{h:'📅 La facturation fondateur',pts:['Le <b>1er mois se règle à la réservation</b> : c\'est ce paiement qui bloque le statut fondateur.','Ce 1er mois <b>couvre le 1er mois de cours à l\'ouverture</b>. Le <b>2e prélèvement</b> intervient au <b>2e mois de pratique</b>.','Interdit : « vous ne payez rien d\'ici l\'ouverture ». C\'est faux.'],say:'« Soyons très clairs : vous réglez votre premier mois aujourd\'hui · c\'est lui qui réserve votre statut fondateur, et il couvre votre premier mois de cours à l\'ouverture. »'},{h:'🎯 Quel pack proposer',pts:['<b>Pack 8 (2×/semaine) par défaut</b> : c\'est le pack « Recommandé » de l\'app, le bon rythme pour des résultats visibles.','<b>Illimité sur besoin motivé</b> : grande disponibilité (3 fois par semaine et plus) ou objectif de performance exprimé pendant la découverte.','<b>Pack 4 en complément</b> : pour quelqu\'un qui pratique déjà une autre activité, ou dont l\'agenda ne permet vraiment qu\'une séance par semaine. Les résultats viennent alors à plus long terme.','Ne présentez pas les 3 packs en vrac : vous recommandez, à partir de ce que le prospect vous a dit.'],say:''},{h:'💎 Annoncer le prix · du coût vers la valeur',pts:['Jamais le prix « tout sec » : piochez <b>2 ou 3 angles</b> selon le client, puis annoncez.','<b>Ramenez à la séance</b> ({P2FS} en Pack 8 fondateur) et comparez au privé : un coach individuel 8 fois par mois, c\'est 8 × {PRIV}.','Ce qui justifie le prix : coach diplômé à chaque cours, 12 personnes max, 5 niveaux, réservation 3 semaines à l\'avance, zéro redondance (Reformer, Chair, TRX…), Reformer pro conçu pour Club Pilates.','Une salle classique coûte moins cher, c\'est vrai : on ne le nie pas, on rappelle que sans cadre on abandonne. « Je préfère payer à la séance » : l\'unité existe à {UNIT}, mais sans régularité, pas de résultat.','Annoncez le prix, puis <b>taisez-vous</b> : laissez le silence travailler.'],say:'« Concrètement, chaque cours vous revient à {P2FS} · avec un coach diplômé, un Reformer dernière génération et 12 personnes maximum. C\'est le prix d\'un cours encadré, pas d\'un accès à une salle. »'}],qs:[{q:'Une prospecte ne peut venir qu\'une fois par semaine et part sur le Pack 4. Elle vous demande : « J\'ai droit aux -{FOUND} à vie, moi aussi ? » Que répondez-vous ?',ch:[{t:'« Non, le Pack 4 a son propre avantage : 1 séance offerte par mois pendant 3 mois, soit 5 séances pour {P1}. »',ok:true},{t:'« Oui, comme toutes nos formules : -{FOUND} à vie sur votre Pack 4, réservé aux {SPOTS} premiers membres. »',ok:false},{t:'« Oui, mais seulement sur vos 3 premiers mois, ensuite vous repassez au tarif normal de {P1}. »',ok:false},{t:'« Non, le Pack 4 n\'a aucun avantage de lancement, mais l\'inscription vous est bien offerte. »',ok:false}],fb:'La remise fondateur ne concerne que le Pack 8 et l\'Illimité. L\'avantage du Pack 4, c\'est 1 séance offerte par mois pendant 3 mois : 5 séances pour {P1}, soit {P1S} la séance.'},{q:'Laquelle de ces phrases décrit correctement l\'offre fondateur ?',ch:[{t:'-{FOUND} à vie sur le Pack 8 et l\'Illimité, réservé aux {SPOTS} premiers membres.',ok:true},{t:'-{FOUND} sur toutes les formules, pendant les 3 premiers mois d\'engagement.',ok:false},{t:'-{FOUND} à vie sur toutes les formules, sans limite de nombre de membres.',ok:false},{t:'-{FOUND} sur l\'Illimité uniquement, pendant la première année d\'abonnement.',ok:false}],fb:'Le -{FOUND} est garanti à vie sur le Pack 8 ({P2F} au lieu de {P2}) et l\'Illimité ({P3F} au lieu de {P3}), pour les {SPOTS} premiers membres seulement.'},{q:'Un prospect vous demande : « Il y a des frais d\'inscription ? Et je m\'engage pour combien de temps ? » Que répondez-vous ?',ch:[{t:'« L\'inscription est offerte, une valeur de 149 €, et l\'engagement est de 3 mois, tacitement renouvelable. »',ok:true},{t:'« L\'inscription est de 149 €, réglée à la réservation, et il n\'y a aucun engagement de durée. »',ok:false},{t:'« L\'inscription est offerte, une valeur de 149 €, et l\'engagement est de 12 mois, renouvelable chaque année. »',ok:false},{t:'« L\'inscription est offerte en Illimité seulement, et l\'engagement est de 3 mois non renouvelable. »',ok:false}],fb:'Frais d\'inscription offerts (valeur 149 €) sur toutes les formules, et engagement de 3 mois à partir de l\'ouverture, tacitement renouvelable. On le dit clairement, c\'est ce qui crée la confiance.'},{q:'Un prospect prêt à réserver vous demande : « Et je paie quand, concrètement ? » Quelle réponse est juste ?',ch:[{t:'« Le 1er mois aujourd\'hui : il bloque votre statut fondateur et couvre votre 1er mois de cours. Le suivant, au 2e mois de pratique. »',ok:true},{t:'« Rien du tout d\'ici l\'ouverture : vous ne payez qu\'à partir de votre tout premier cours au studio, le jour où vous venez. »',ok:false},{t:'« Les 3 mois d\'engagement aujourd\'hui, en une seule fois : c\'est ce paiement groupé qui bloque votre statut fondateur. »',ok:false},{t:'« Le 1er mois aujourd\'hui, puis un prélèvement chaque mois à partir de maintenant, que le studio soit ouvert ou non. »',ok:false}],fb:'Le 1er mois réglé à la réservation bloque le statut fondateur et couvre le 1er mois de cours à l\'ouverture ; le 2e prélèvement arrive au 2e mois de pratique. « Vous ne payez rien d\'ici l\'ouverture » est faux et interdit.'},{q:'Un prospect vous demande : « Il reste combien de places fondateur ? » Que répondez-vous ?',ch:[{t:'« Je n\'ai pas le chiffre exact sous les yeux, mais elles partent vite : je vous conseille de réserver la vôtre aujourd\'hui. »',ok:true},{t:'« Il en reste {SPOTS} : c\'est le nombre officiel de places fondateur, vous avez encore largement le temps. »',ok:false},{t:'« Il en reste 3 ou 4 tout au plus : décidez-vous vite, sinon ce sera trop tard pour vous. »',ok:false},{t:'« Aucune idée : rappelez le studio la semaine prochaine, on pourra vous donner le chiffre. »',ok:false}],fb:'On ne connaît pas le chiffre exact à la minute : on ne l\'invente pas, mais on crée l\'urgence avec ce qui est vrai, les places partent vite. {SPOTS}, c\'est le nombre de places au départ, pas ce qu\'il reste.'},{q:'Une prospecte peut venir 2 fois par semaine, veut soulager son dos et n\'a pas d\'objectif de performance. Quel pack lui recommandez-vous ?',ch:[{t:'Le Pack 8 : c\'est la recommandation par défaut, au rythme de 2 séances par semaine.',ok:true},{t:'L\'Illimité : on présente toujours la formule la plus complète en premier.',ok:false},{t:'Le Pack 4 : on commence petit pour la rassurer, on montera plus tard.',ok:false},{t:'Aucun en particulier : je lui détaille les 3 packs et je la laisse choisir.',ok:false}],fb:'Pack 8 par défaut, le bon rythme pour des résultats visibles. L\'Illimité se propose sur un besoin motivé (grande disponibilité, objectif de performance), le Pack 4 en complément ou pour un agenda limité à 1 séance par semaine.'},{q:'Vous arrivez au moment du prix dans l\'appel. Quelle approche suit la méthode ?',ch:[{t:'J\'installe la valeur avec 2 ou 3 angles, je ramène à la séance, j\'annonce, puis je me tais.',ok:true},{t:'J\'annonce le prix mensuel d\'emblée, puis j\'enchaîne tous les arguments sans faire de pause.',ok:false},{t:'J\'annonce le prix barré, puis je présente la remise comme valable aujourd\'hui seulement.',ok:false},{t:'Je compare avec une salle de sport, que je présente comme plus chère que notre studio.',ok:false}],fb:'On ne donne jamais le prix « tout sec » : 2 ou 3 angles (coût par séance, coach inclus, 12 max), puis l\'annonce, puis le silence. Une salle classique coûte moins cher : on ne le nie pas, et on n\'invente jamais d\'urgence.'},{q:'Un prospect vous dit : « Moi, je préfère payer à la séance. » Que répondez-vous ?',ch:[{t:'« C\'est possible, {UNIT} la séance. Mais en Pack 8 fondateur, c\'est {P2FS}, et c\'est la régularité qui fait les résultats. »',ok:true},{t:'« Ce n\'est pas possible chez nous : sans abonnement, vous ne pouvez pas réserver de cours au studio, c\'est la règle. »',ok:false},{t:'« C\'est possible, {PRIV} la séance. Mais en Pack 8 fondateur, elle revient à {P2FS}, donc l\'abonnement s\'impose. »',ok:false},{t:'« Très bien, je vous inscris à l\'unité : c\'est plus souple, et vous verrez plus tard si un pack vous intéresse. »',ok:false}],fb:'La séance à l\'unité existe à {UNIT} ({PRIV}, c\'est la séance privée). Sans régularité, pas de résultat : on ramène au coût par séance du pack recommandé.'},{q:'Un prospect vient de s\'abonner. Que faites-vous avant de raccrocher ?',ch:[{t:'« Vous connaissez quelqu\'un que ça motiverait ? Avec le parrainage, -25 € chacun sur votre prochain prélèvement. »',ok:true},{t:'« Merci beaucoup, à très bientôt au studio ! » et je raccroche pour enchaîner sur l\'appel suivant.',ok:false},{t:'« Si vous ramenez un ami, je vous offre un mois complet gratuit en remerciement de votre confiance. »',ok:false},{t:'« Le parrainage existe, mais il est réservé aux membres inscrits depuis plus d\'un an au studio. »',ok:false}],fb:'Après le oui, le nouveau membre est conquis : c\'est le meilleur moment pour parler du parrainage, -25 € pour le parrain et -25 € pour le filleul sur leur prochain prélèvement, cumulable avec l\'offre fondateur. On n\'invente jamais une autre récompense ni une condition.'},{q:'Une nouvelle membre fondatrice vous demande si le parrainage s\'ajoute à son -20 %. Que répondez-vous ?',ch:[{t:'« Oui, ça se cumule : -25 € sur votre prochain prélèvement, en plus de votre -20 % à vie. »',ok:true},{t:'« Non, c\'est l\'un ou l\'autre : le parrainage remplacerait votre -20 % fondateur. »',ok:false},{t:'« Oui, et les 25 € sont déduits chaque mois tant que votre filleul reste inscrit. »',ok:false},{t:'« Oui, mais seulement si la personne que vous parrainez prend elle aussi l\'Illimité. »',ok:false}],fb:'Le parrainage se cumule avec l\'offre fondateur : -25 € pour le parrain et -25 € pour le filleul, une fois, sur leur prochain prélèvement. Le parrain doit déjà être inscrit.'}]},
  {id:'k7',ic:'🔬',t:'La science & les règles d\'or',sub:'Ce que prouvent les études, ce qu\'on n\'en dit jamais, et les règles d\'or au téléphone.',lesson:[{h:'🔬 L\'essentiel : efficace, mais pas magique',pts:['La recherche soutient le Pilates, Reformer compris, sur <b>4 terrains</b> : la lombalgie chronique (mal de dos qui dure), la posture, le gainage profond et la souplesse.','Le niveau de preuve est <b>modéré</b> : l\'effet est réel, mais le Pilates n\'est <b>pas démontré supérieur</b> aux autres exercices encadrés. On ne dit donc jamais « c\'est prouvé, c\'est plus efficace que la salle ou le yoga ».','Les vrais effets (dos, silhouette, stress) arrivent <b>avec la régularité</b>. Promettre un miracle ou un changement physique dès la première séance, c\'est survendre.','Dire vrai vous rend <b>plus crédible</b> que tous les concurrents qui promettent la lune.'],say:'« Oui, c\'est prouvé · avec de la régularité. Et c\'est justement pour ça qu\'on vous recommande 2 séances par semaine. »'},{h:'📊 Les 3 études à savoir citer',pts:['<b>Revue Cochrane 2015</b>, la référence du domaine : <b>10 essais randomisés, 510 participants</b>. Le Pilates réduit la douleur et l\'incapacité dans la <b>lombalgie chronique</b>, à court et moyen terme.','<b>Méta-analyse IJERPH 2023</b> (une méta-analyse regroupe les résultats de plusieurs études) : amélioration significative de la douleur et de l\'incapacité chez les lombalgiques chroniques. Elle va dans le même sens que Cochrane, toujours sur le dos.','<b>Méta-analyse Frontiers in Physiology 2021</b>, sur le poids : <b>11 essais, 393 participants en surpoids</b>. En moyenne <b>2,4 kg</b> et <b>1,17 point d\'IMC</b> (indice de masse corporelle) en moins, par rapport aux groupes témoins.','Ne mélangez jamais les chiffres : <b>10 essais et 510 participants = le dos</b> (Cochrane), <b>11 essais et 393 participants = le poids</b> (Frontiers).','Sur le poids, la franchise d\'abord : 2,4 kg est <b>une moyenne d\'études, jamais une promesse< let SIM=null;
function startSim(x,scenId){
  const scen=scenId?SIM_CURRICULUM.find(s=>s.id===scenId):null;
  const p=scen?{nom:scen.nom,goal:scen.goal,goalTxt:SIM_GOALS[scen.goal],char:SIM_CHARS.find(c=>c.id===scen.char),o1:scen.o1,o2:scen.o2,pack:2,
    prix:fmtEur(foundingMonthly(2)??packMonthly(2)),ps:fmtEur(foundingPerSession(2)??packPerSession(2))||'25,20 €'}:simPersona();
  const steps=simSteps(p).map(s=>s==='OBJ1'?{obj:p.o1}:s==='OBJ2'?{obj:p.o2}:s==='PRIX'?{obj:'prix',prefix:`« Le Pack 8, c'est ${fmtEur(packMonthly(2))} par mois · et comme membre fondateur, ${p.prix} à vie, soit ${p.ps} la séance. » … `}:s);
  SIM={p:p,steps:steps,i:0,score:0,hist:[],mist:[],done:false,pick:null,scen:scen?scen.id:null};
  renderSim();
}
function simStepData(s){
  if(s.obj){const O=SIM_OBJS[s.obj];return {c:(s.prefix||'')+O.c(SIM.p),ch:O.ch.map(c=>({t:c.t.replace('${ps}',SIM.p.ps),pts:c.pts,fb:c.fb}))};}
  return s;
}
function simChoose(ci){
  if(SIM.pick!==null)return;
  const s=simStepData(SIM.steps[SIM.i]),c=s.ch[SIM._order[ci]];
  SIM.pick=ci;SIM.score+=Math.max(0,c.pts);
  if(c.pts<10)SIM.mist.push(c.fb);
  SIM.hist.push({c:s.c,me:c.t,fb:c.fb,good:c.pts>=10,mid:c.pts>0&&c.pts<10});
  renderSim();
  setTimeout(()=>{SIM.i++;SIM.pick=null;if(SIM.i>=SIM.steps.length)SIM.done=true;renderSim();},1700);
}
function renderSim(){_vReg('sim');
  $('#topPhase').textContent='Entraînement';$('#topSub').textContent='';
  $('#bar').style.width=Math.round(SIM.i/SIM.steps.length*100)+'%';
  const p=SIM.p;
  let h=`<div class="cg"><div class="sim-head"><div><h2 class="pr-h2">🎬 Appel d'entraînement</h2><div class="pr-h2s">${esc(p.nom)}, ${p.char.lbl} · veut ${p.goalTxt} · client virtuel</div></div><div class="sim-score">${SIM.score}<small>pts</small></div></div>`;
  h+='<div class="sim-chat" id="simChat">';
  SIM.hist.forEach(x=>{
    h+=`<div class="sim-b c">${esc(x.c)}</div><div class="sim-b me">${x.me}</div><div class="sim-fb ${x.good?'ok':x.mid?'mid':'ko'}">${x.fb}</div>`;
  });
  if(!SIM.done){
    const s=simStepData(SIM.steps[SIM.i]);
    h+=`<div class="sim-b c new">${esc(s.c)}</div>`;
    if(SIM.pick===null){
      if(!SIM._orderStep||SIM._orderStep!==SIM.i){SIM._order=[0,1,2].sort(()=>Math.random()-.5);SIM._orderStep=SIM.i;}
      h+=`<div class="sim-choices">${SIM._order.map((oi,ci)=>`<button class="sim-ch" onclick="simChoose(${ci})">${s.ch[oi].t}</button>`).join('')}</div>`;
    }
  } else {
    const max=SIM.steps.length*10,pct=Math.round(SIM.score/max*100);
    const titre=pct>=85?'🏆 Master Coach en herbe':pct>=70?'🥇 Closer solide':pct>=50?'💪 Bonne base, continue':'🌱 Débutant courageux';
    const best=+localStorage.getItem('cpcoach_simbest')||0;
    if(SIM.score>best)localStorage.setItem('cpcoach_simbest',String(SIM.score));
    if(SIM.scen&&!SIM._pushed){SIM._pushed=true;
      const prev=TRAIN[SIM.scen];
      if(!prev||pct>prev.s){TRAIN[SIM.scen]={s:pct,ts:new Date().toISOString()};localStorage.setItem('cpcoach_train',JSON.stringify(TRAIN));}
      syncCall('train_push',{scen:SIM.scen,score:pct,nom:CFG.rep||''}).catch(()=>{});
    }
    h+=`<div class="sim-end">
      <div class="sim-end-t">${titre}</div>
      <div class="sim-end-n">${SIM.score}<small>/ ${max} pts</small></div>
      ${SIM.score>best?'<div class="sim-rec">🎉 Nouveau record personnel !</div>':best?`<div class="sim-rec muted">Record : ${Math.max(best,SIM.score)} pts</div>`:''}
      ${SIM.mist.length?`<div class="sim-mist"><b>À retravailler :</b>${SIM.mist.slice(0,4).map(m=>`<div>· ${m.replace(/^[✓✗~]\\s*/,'')}</div>`).join('')}</div>`:'<div class="sim-rec">Sans faute · l\'appel parfait ! 👏</div>'}
      ${SIM.scen?`<div class="tr-verdict ${pct>=SIM_SEUIL?'ok':'ko'}">${pct>=SIM_SEUIL?'✅ Scénario validé · enregistré dans votre formation':'🔁 Non validé (minimum '+SIM_SEUIL+' %) · retentez-le'}</div>`:''}
      <div style="display:flex;gap:9px;margin-top:12px">
        ${SIM.scen?`<button class="go ok" style="flex:1" onclick="startSim(null,'${SIM.scen}')">🔄 Retenter</button>`:`<button class="go ok" style="flex:1" onclick="startSim()">🔄 Nouvel appel</button>`}
        <button class="go" style="flex:1" onclick="showTraining()">📋 Parcours</button>
      </div>
    </div>`;
  }
  h+='</div></div>';
  $('#screen').innerHTML=h;relocateBoxes();
  $('#nav').innerHTML=`<button class="go" onclick="renderScreen()">📞 Revenir au vrai appel</button>`;
  const sc=document.getElementById('simChat');if(sc)$('#screen').scrollTop=$('#screen').scrollHeight;
}

   INTRO CLASS · saisie équipe : séances (inscrits/présents), planning
   type, ventes rattachées. Les primes/commissions se CALCULENT, jamais
